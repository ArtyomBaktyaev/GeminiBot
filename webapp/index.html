    const back = h("textarea", { placeholder:"Перевод, определение или ответ…" });
    const ex = h("input", { type:"text", placeholder:"Пример использования (необязательно)" });
    const deck = h("input", { type:"text", value:"общее", placeholder:"Колода (напр., Матан, Физика, English)" });
    const aiTopic = h("input", { type:"text", placeholder:"Тема для авто-генерации ИИ (напр., Ряды Тейлора)" });

    return h("div", {},
      field("Лицевая сторона (вопрос)", front),
      h("div", { style:{marginTop:"8px"} }, field("Подсказка / транскрипция", ph)),
      h("div", { style:{marginTop:"8px"} }, field("Обратная сторона (ответ)", back)),
      h("div", { style:{marginTop:"8px"} }, field("Пример", ex)),
      h("div", { style:{marginTop:"8px"} }, field("Колода", deck)),
      h("button", { class:"btn block", style:{marginTop:"14px"}, onclick: async (e) => {
        if (!front.value.trim() || !back.value.trim()) return toast("Заполните вопрос и ответ", "err");
        e.target.disabled = true;
        try {
          await api("/api/cards", {
            method:"POST",
            body: {
              front: front.value.trim(),

              back: back.value.trim(),
              ex: ex.value.trim(),
              deck: deck.value.trim() || "общее"
            }
          });

function runQuizModal(qz) {
  const questions = qz.questions || [];
  if (!questions.length) return toast("Не удалось получить вопросы", "err");
  let idx = 0, score = 0;

  sheet(qz.title || "🎯 Квиз", (close) => {
    const body = h("div", {});
    const step = () => {
      if (idx >= questions.length) {
        const pct = Math.round(100 * score / questions.length);
        body.replaceChildren(
          h("div", { class:"empty" },
            h("div", { class:"big" }, pct >= 80 ? "🏆" : pct >= 50 ? "👍" : "📚"),
            h("h3", {}, "Результат: " + score + " из " + questions.length + " (" + pct + "%)"),
            h("p", {}, pct >= 80 ? "Отличный результат!" : "Хорошая тренировка, продолжай в том же духе."),
            h("button", { class:"btn block", onclick: () => { close(); render(); } }, "Готово")
          )
        );
        return;
      }
      const item = questions[idx];
      const optsWrap = h("div", { class:"stack", style:{marginTop:"12px"} });
      const explainBox = h("div", { class:"info-box hidden", style:{marginTop:"12px"} });
      const nextBtn = h("button", { class:"btn block hidden", style:{marginTop:"12px"}, onclick: () => { idx++; step(); } },
        idx + 1 < questions.length ? "Следующий вопрос →" : "Завершить квиз 🏁");

      let answered = false;
      (item.options || []).forEach((optText, oi) => {
        const b = h("button", {
          class:"btn ghost",
          style:{justifyContent:"flex-start", textAlign:"left"},
          onclick: () => {
            if (answered) return;
            answered = true;
            const correctIdx = typeof item.answer === "number" ? item.answer : item.correct;
            const isOk = oi === correctIdx;
            if (isOk) { score++; pick("success"); b.style.borderColor = "var(--ok)"; b.style.background = "var(--ok-soft)"; }
            else { pick("error"); b.style.borderColor = "var(--danger)"; b.style.background = "var(--danger-soft)"; }
            if (item.explain || item.explanation) {
              explainBox.textContent = "💡 " + (item.explain || item.explanation);
              explainBox.classList.remove("hidden");
            }
            nextBtn.classList.remove("hidden");
          }
        }, optText);
        optsWrap.append(b);
      });

      body.replaceChildren(
        h("div", { class:"session-progress" },
          h("span", {}, "Вопрос " + (idx + 1) + " / " + questions.length),
          h("div", { class:"bar" }, h("i", { style:{ width: Math.round(100 * idx / questions.length) + "%" } })),
          h("span", {}, "✓ " + score)
        ),
        h("div", { class:"card", style:{marginTop:"8px"} },
          h("div", { style:{fontWeight:700, fontSize:"1.02rem"} }, item.q || item.question),
          optsWrap,
          explainBox,
          nextBtn
        )
      );
    };
    step();
    return body;
  });
}

function chatDialogPane() {
  const wrap = h("div", { class:"chat-wrap" });
  const listBox = h("div", {});
  const chatList = currentChatList();

  const drawMessages = () => {
    listBox.replaceChildren();
    if (!chatList.length) {
      listBox.append(empty("🤖", "Чем помочь по учёбе или коду?",
        "Прикрепляй PDF, фото задач, код или спрашивай напрямую — контекст и README твоего профиля уже подключены.",
        h("div", { class:"chips", style:{justifyContent:"center"} },
          h("button", { class:"chip", onclick: () => sendQuick("Что у меня сегодня по парам и дедлайнам?") }, "📅 Сводка на сегодня"),
          h("button", { class:"chip", onclick: () => sendQuick("Создай PDF-шпаргалку по основным формулам") }, "📄 Создать PDF")
        )
      ));
      return;
    }

    chatList.forEach((m, idx) => {
      const isMe = m.role === "user";
      const attFiles = m.attached_files || [];
      const botFiles = m.files || [];

      const bubble = h("div", { class:"bubble " + (isMe ? "me" : "bot") },
        attFiles.length ? h("div", { class:"msg-att-list" },
          attFiles.map(af => h("div", { class:"msg-att-item", onclick: () => previewFileModal(af) },
            h("div", { class:"att-thumb" }, "📎"),
            h("div", { class:"att-meta" },
              h("span", { class:"att-name" }, af.name || "файл"),
              h("span", { class:"att-sub" }, (af.size ? fmtBytes(af.size) + " · " : "") + "открыть")
            )
          ))
        ) : null,

        m.loading
          ? h("div", { class:"dots" }, h("span"), h("span"), h("span"))
          : (isMe ? h("div", { style:{whiteSpace:"pre-wrap"} }, m.text) : renderMd(m.text)),

        botFiles.map(bf => {
          const dlUrl = "/api/files/" + bf.id + "?initData=" + encodeURIComponent(getInitData()) + "&acc=" + encodeURIComponent(getActiveAccountId()) + "&client=tg";
          return h("div", { class:"bot-file-card" },
            h("div", { class:"bf-head", style:{cursor:"pointer"}, onclick: () => previewFileModal(bf) },
              h("div", { class:"bf-ic" }, "📄"),
              h("div", { class:"grow" },
                h("div", { class:"bf-name" }, bf.name),
                h("div", { class:"bf-sub" }, fmtBytes(bf.size) + (bf.caption ? " · " + bf.caption : ""))
              )
            ),
            h("div", { class:"btn-row" },
              h("button", { class:"btn ghost small", onclick: () => previewFileModal(bf) }, "👁 Просмотр"),
              h("a", { class:"btn ghost small", href: dlUrl, download: bf.name, target:"_blank" }, "⬇️ Скачать"),
              h("button", { class:"btn subtle small", onclick: async (ev) => {
                ev.target.disabled = true;
                try {
                  await api("/api/files/" + bf.id + "/send", { method:"POST" });
                  pick("success"); toast("Отправлено в Telegram 📨", "ok");
                } catch (e) { toast(e.message, "err"); }
                ev.target.disabled = false;
              }}, "📨 В ТГ")
            )
          );
        }),

        !m.loading ? h("div", { class:"meta-row" },
          m.model ? h("span", {}, "⚡ " + shortModelName(m.model)) : null,
          h("button", { class:"act-btn", onclick: () => {
            navigator.clipboard.writeText(m.text || "");
            toast("Скопировано 📋", "ok");
          }}, "📋 Копировать"),
          h("button", { class:"act-btn", onclick: async () => {
            chatList.splice(idx, 1);
            drawMessages();
            try { await api("/api/chat/delete", { method:"POST", body: { id: m.id, ts: m.ts } }); } catch (e) {}
          }}, "🗑")
        ) : null
      );
      listBox.append(bubble);
    });
  };

  const filesBar = h("div", { class:"chat-files-bar hidden" });
  const drawFilesBar = () => {
    if (!S.chatFiles.length) {
      filesBar.classList.add("hidden");
      filesBar.replaceChildren();
      return;
    }
    filesBar.classList.remove("hidden");
    filesBar.replaceChildren(...S.chatFiles.map((f, i) =>
      h("div", {
        class:"chat-file-chip",
        onclick: () => previewFileModal(f, () => { S.chatFiles.splice(i, 1); drawFilesBar(); })
      },
        h("span", {}, "📎"),
        h("span", { class:"cf-name" }, f.name),
        h("button", {
          onclick: (ev) => { ev.stopPropagation(); S.chatFiles.splice(i, 1); drawFilesBar(); }
        }, "✕")
      )
    ));
  };

  const inp = h("input", {
    type:"text",
    placeholder:"Сообщение для ИИ…",
    onkeydown: (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); } }
  });

  const fileInp = h("input", {
    type:"file", multiple:true, class:"hidden",
    onchange: async (e) => {
      if (!e.target.files || !e.target.files.length) return;
      try {
        const added = await readFilesAsDataURL(e.target.files);
        S.chatFiles.push(...added.slice(0, 5));
        drawFilesBar();
      } catch (err) { toast(err.message, "err"); }
      e.target.value = "";
    }
  });

  const sendBtn = h("button", {
    class:"send-btn",
    onclick: () => {
      if (S.sending && S.abortCtrl) {
        S.abortCtrl.abort();
        return;
      }
      doSend();
    }
  }, "➤");

  function sendQuick(txt) {
    inp.value = txt;
    doSend();
  }

  async function doSend() {
    if (S.sending) return;
    const text = inp.value.trim();
    const filesToSend = [...S.chatFiles];
    if (!text && !filesToSend.length) return;

    inp.value = "";
    S.chatFiles = [];
    drawFilesBar();

    const uId = "u_" + Date.now();
    const bId = "b_" + Date.now();
    const userEntry = {
      id: uId,
      role: "user",
      text: text || "📎 Прикреплён файл",
      attached_files: filesToSend
    };
    const botEntry = { id: bId, role: "bot", text: "", loading: true };
    chatList.push(userEntry, botEntry);
    drawMessages();
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

    S.sending = true;
    S.abortCtrl = new AbortController();
    sendBtn.classList.add("stop");
    sendBtn.textContent = "■";

    try {
      const res = await api("/api/ask", {
        method: "POST",
        body: { text, files: filesToSend, user_msg_id: uId, bot_msg_id: bId },
        signal: S.abortCtrl.signal
      });
      botEntry.loading = false;
      botEntry.text = res.answer || "";
      botEntry.model = res.model;
      botEntry.files = res.files || [];
      botEntry.ts = res.ts;
      if (res.attached_files && res.attached_files.length) {
        userEntry.attached_files = res.attached_files;
      }
      userEntry.ts = res.ts;
      hap("light");
    } catch (err) {
      botEntry.loading = false;
      botEntry.text = err.name === "AbortError" ? "⏹ Запрос остановлен пользователем." : ("❌ Ошибка: " + err.message);
    } finally {
      S.sending = false;
      S.abortCtrl = null;
      sendBtn.classList.remove("stop");
      sendBtn.textContent = "➤";
      drawMessages();
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }
  }

  drawMessages();
  drawFilesBar();

  if (chatList.length) {
    wrap.append(h("div", { class:"row between", style:{marginBottom:"8px"} },
      h("span", { class:"sub" }, "Сообщений в сессии: " + chatList.length),
      h("button", { class:"chip gray", onclick: async () => {
        await api("/api/chat/clear", { method:"POST" });
        chatList.length = 0;
        drawMessages();
        toast("Диалог очищен 🧹", "ok");
      }}, "🧹 Очистить диалог")
    ));
  }

  wrap.append(
    listBox,
    h("div", { class:"chat-dock" },
      filesBar,
      h("div", { class:"chatbar" },
        h("label", { class:"attach-btn", title:"Прикрепить файл" }, "📎", fileInp),
        inp,
        sendBtn
      )
    )
  );
  return wrap;
}

async function generateStoryCardModal(st) {
  sheet("📸 Шэр-карточка для Сторис", (close) => {
    const canvas = h("canvas", {
      width: 1080, height: 1920,
      style: { width:"100%", maxWidth:"310px", borderRadius:"18px", border:"1px solid var(--line-2)", display:"block", margin:"0 auto" }
    });
    const ctx = canvas.getContext("2d");

    // 1. Фон Editorial Cyber-Botanical
    const grad = ctx.createLinearGradient(0, 0, 1080, 1920);
    grad.addColorStop(0, "#070b12");
    grad.addColorStop(0.5, "#0f1f1c");
    grad.addColorStop(1, "#06080e");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1080, 1920);

    // Световое пятно
    const rad = ctx.createRadialGradient(540, 620, 40, 540, 620, 520);
    rad.addColorStop(0, "rgba(163, 230, 53, 0.28)");
    rad.addColorStop(1, "transparent");
    ctx.fillStyle = rad;
    ctx.fillRect(0, 0, 1080, 1920);

    // Рамка тонкая редакционная
    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.lineWidth = 3;
    ctx.strokeRect(64, 64, 952, 1792);

    // Верхний колонтитул
    ctx.fillStyle = "#a3e635";
    ctx.font = "800 34px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("DAILY GROWTH PROTOCOL // " + st.today, 120, 155);

    // Имя пользователя
    ctx.fillStyle = "#f8fafc";
    ctx.font = "900 64px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText((st.name || "Игрок").toUpperCase(), 120, 245);

    // Живое дерево в центре
    ctx.save();
    ctx.translate(540, 660);
    ctx.fillStyle = "#1e293b";
    ctx.beginPath();
    ctx.ellipse(0, 140, 220, 55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#10b981";
    ctx.beginPath();
    ctx.arc(0, -20, 130, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#a3e635";
    ctx.beginPath();
    ctx.arc(-70, 10, 95, 0, Math.PI * 2);
    ctx.arc(70, 10, 95, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(-14, 10, 28, 135);
    ctx.restore();

    // Огромная цифра серии
    ctx.fillStyle = "#a3e635";
    ctx.font = "900 250px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(String(st.streak) + "🔥", 115, 1190);

    ctx.fillStyle = "#94a3b8";
    ctx.font = "700 44px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("ДНЕЙ БЕЗ ПРОПУСКОВ · " + (st.companion ? st.companion.title.toUpperCase() : ""), 120, 1265);

    // Плашки Уровня и XP
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fillRect(120, 1340, 840, 210);
    ctx.fillStyle = "#ffffff";
    ctx.font = "900 68px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(`УРОВЕНЬ ${st.level}  ·  ${st.xp} XP`, 165, 1445);
    ctx.fillStyle = "#a3e635";
    ctx.font = "600 36px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(`Активных привычек: ${(st.goals || []).length}  |  Заморозок: ❄️ ${st.freeze}`, 165, 1510);

    // Подвал с ботом
    ctx.fillStyle = "#64748b";
    ctx.font = "700 34px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(st.bot ? "@" + st.bot : "Telegram Mini App · Академический Ассистент", 120, 1785);

    return h("div", {},
      canvas,
      h("div", { class:"btn-row", style:{marginTop:"14px"} },
        h("button", {
          class:"btn ghost",
          onclick: () => {
            const link = document.createElement("a");
            link.download = `streak-${st.streak}-days.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
            toast("Картинка сохранена 📥", "ok");
          }
        }, "⬇️ Скачать PNG"),
        h("button", {
          class:"btn",
          onclick: async () => {
            canvas.toBlob(async (blob) => {
              if (!blob) return;
              const file = new File([blob], "streak.png", { type: "image/png" });
              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                  await navigator.share({
                    files: [file],
                    title: `Моя серия: ${st.streak} дн.`,
                    text: `🔥 Моя серия — ${st.streak} дн. (Уровень ${st.level}, ${st.xp} XP)!`
                  });
                  return;
                } catch (e) {}
              }
              const link = document.createElement("a");
              link.download = `streak-${st.streak}-days.png`;
              link.href = canvas.toDataURL("image/png");
              link.click();
              toast("Скачано! Выложи в сторис 📸", "ok");
            }, "image/png");
          }
        }, "📲 Поделиться в Сторис")
      )
    );
  });
}

async function openDuelModal(duelId) {
  let d;
  try { d = await api("/api/g/duel/" + encodeURIComponent(duelId)); }
  catch (e) { return toast(e.message, "err"); }

  sheet("⚔️ Дуэль: " + d.topic, (close) => {
    const box = h("div", {});
    const qs = d.qs || [];
    const answers = [];
    let idx = 0;

    const botLink = S.growthBot
      ? `https://t.me/${S.growthBot}?startapp=duel_${duelId}`
      : location.origin + `/app?duel=${duelId}`;

    const renderResults = (resList, myScore) => {
      box.replaceChildren(
        h("div", { class:"card center" },
          h("div", { style:{fontSize:"42px"} }, "⚔️"),
          h("h2", { style:{margin:"6px 0"} }, myScore != null ? `Твой счёт: ${myScore} из ${qs.length}` : "Таблица дуэли"),
          h("div", { class:"sub" }, "Код дуэли: "),
          h("span", { class:"chip mono", style:{marginTop:"4px"} }, duelId)
        ),
        h("div", { class:"stack", style:{marginBottom:"14px"} },
          ...(resList || []).map((r, i) =>
            h("div", { class:"g-rank-row" },
              h("span", { class:"g-rank-pos" }, "#" + (i + 1)),
              h("span", { class:"grow", style:{fontWeight:700} }, r.name),
              h("span", { class:"chip green" }, r.score + " / " + (r.total || 5))
            )
          )
        ),
        h("div", { class:"btn-row" },
          h("button", {
            class:"btn",
            onclick: () => {
              const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(botLink)}&text=${encodeURIComponent("⚔️ Вызываю тебя на дуэль знаний по теме «" + d.topic + "»! Код: " + duelId)}`;
              if (tg && tg.openTelegramLink) tg.openTelegramLink(shareUrl);
              else window.open(shareUrl, "_blank");
            }
          }, "📨 Бросить вызов другу"),
          h("button", {
            class:"btn ghost",
            onclick: () => {
              navigator.clipboard.writeText(duelId);
              toast("Код " + duelId + " скопирован!", "ok");
            }
          }, "📋 Код: " + duelId)
        )
      );
    };

    if (d.played || !qs.length) {
      renderResults(d.res, null);
      return box;
    }

    const step = () => {
      if (idx >= qs.length) {
        box.replaceChildren(h("div", { class:"center sub", style:{padding:"24px"} }, "⏳ Подсчёт очков…"));
        api("/api/g/duel/" + encodeURIComponent(duelId) + "/answer", {
          method:"POST", body:{ a: answers }
        }).then(r => {
          pick("success");
          renderResults(r.res, r.score);
          render();
        }).catch(err => toast(err.message, "err"));
        return;
      }
      const q = qs[idx];
      box.replaceChildren(
        h("div", { class:"session-progress" },
          h("span", {}, `Вопрос ${idx + 1} / ${qs.length}`),
          h("div", { class:"bar" }, h("i", { style:{width: Math.round(100 * idx / qs.length) + "%"} }))
        ),
        h("div", { class:"card" },
          h("div", { style:{fontWeight:800, fontSize:"1.02rem", marginBottom:"12px"} }, q.q),
          h("div", { class:"stack" },
            ...(q.a || []).map((opt, oi) =>
              h("button", {
                class:"btn ghost",
                style:{justifyContent:"flex-start", textAlign:"left"},
                onclick: () => { hap(); answers.push(oi); idx++; step(); }
              }, opt)
            )
          )
        )
      );
    };
    step();
    return box;
  });
}

            ev.target.disabled = true;
            try {
              await api("/api/g/briefing", { method:"POST" });
              pick("success"); toast("Брифинг отправлен в Telegram! 📬", "ok");
            } catch (e) { toast(e.message, "err"); }
            ev.target.disabled = false;
          }
        }, "📬 Тест в ТГ"),
        h("button", {
          class: "sw" + (st.notify ? " on" : ""),
          onclick: async (ev) => {
            ev.target.classList.toggle("on");
            await api("/api/g/notify", { method:"POST" });
          }
        })
      )
    )
  );

  return box;
}

function renderGrowthAiPane(st) {
  const box = h("div", { class:"g-shell" });

  // 1. СФОТКАЛ КОНСПЕКТ / ЗАДАЧУ ИЛИ ЗАГРУЗИЛ ГОЛОСОВОЕ С ЛЕКЦИИ
  let snapFiles = [];
  let snapKind = "photo";
  const fileLabel = h("span", {}, "📷 Выбрать фото задачи/конспекта или 🎤 аудио лекции");
  const snapText = h("input", { type:"text", placeholder:"Доп. комментарий или тема (необязательно)…" });
  const snapResult = h("div", {});

  const snapInput = h("input", {
    type:"file", accept:"image/*,audio/*,.ogg,.mp3,.m4a,.wav,.pdf", class:"hidden",
    onchange: async (e) => {
      if (!e.target.files || !e.target.files.length) return;
      const f = e.target.files[0];
      snapKind = (f.type || "").startsWith("audio/") || /\.(ogg|mp3|m4a|wav)$/i.test(f.name) ? "voice" : "photo";
      snapFiles = await readFilesAsDataURL([f]);
      fileLabel.textContent = (snapKind === "voice" ? "🎤 Аудио: " : "📷 Файл: ") + f.name;
      toast("Файл готов к разбору", "ok");
    }
  });

  box.append(
    h("div", { class:"g-sec-head" },
      h("h2", {}, "Сфоткал конспект / Голосовое с лекции"),
      h("span", { class:"num" }, "РАЗБОР + КАРТОЧКИ + ТЕСТ")
    ),
    h("div", { class:"card stack" },
      h("div", { class:"sub" },
        "Загрузи фото доски/тетради или голосовое с пары — ИИ выдаст пошаговый разбор, сам добавит карточки в колоду «Учёба» и соберёт мини-тест."),
      h("label", { class:"file-upload-zone" }, fileLabel, snapInput),
      snapText,
      h("button", {
        class:"btn block",
        onclick: async (ev) => {
          if (!snapFiles.length && !snapText.value.trim()) {
            return toast("Прикрепи фото/аудио или введи текст задачи", "err");
          }
          ev.target.disabled = true;
          ev.target.textContent = "⏳ ИИ разбирает материал и создаёт карточки…";
          try {
            const r = await api("/api/g/snap", {
              method:"POST",
              body:{ kind: snapKind, text: snapText.value.trim(), files: snapFiles, save_cards: true }
            });
            pick("success");
            snapResult.replaceChildren(
              h("div", { class:"info-box", style:{marginTop:"10px"} },
                h("div", { class:"row between wrap", style:{marginBottom:"8px"} },
                  h("span", { class:"chip green" }, `🃏 Сохранено карточек: ${r.saved_cards || (r.cards || []).length}`),
                  (r.quiz && r.quiz.length) ? h("button", {
                    class:"btn small",
                    onclick: () => runQuizModal({ title: r.title, questions: r.quiz })
                  }, "🎯 Пройти тест по конспекту") : null
                ),
                renderMd(r.answer || "")
              )
            );
            toast("Готово! Карточки добавлены в «Учёбу» 🎉", "ok");
          } catch (e) { toast(e.message, "err"); }
          ev.target.disabled = false;
          ev.target.textContent = "🚀 Разобрать + создать карточки и тест";
        }
      }, "🚀 Разобрать + создать карточки и тест"),
      snapResult
    )
  );

  // 2. РЕЖИМ «СДАТЬ ЗА N ДНЕЙ» С АВТО-ЗАПИСЬЮ В РАСПИСАНИЕ ПАР
  const subjInp = h("input", { type:"text", value: st.plan_subject || "", placeholder:"Напр., Математический анализ, Электродинамика…" });
  const dateInp = h("input", { type:"date", value: st.plan_date || addDays(st.today, 14) });
  const timeInp = h("input", { type:"time", value: "19:00" });

  box.append(
    h("div", { class:"g-sec-head" },
      h("h2", {}, "Режим «Сдать экзамен за N дней»"),
      h("span", { class:"num" }, "АВТО-СЛОТЫ В РАСПИСАНИИ")
    ),
    h("div", { class:"card stack" },
      field("Предмет или экзамен", subjInp),
      h("div", { class:"row" },
        h("div", { class:"grow" }, field("Дата сдачи", dateInp)),
        h("div", { class:"grow" }, field("Время слота в расписании", timeInp))
      ),
      h("button", {
        class:"btn block",
        onclick: async (ev) => {
          if (!subjInp.value.trim() || !dateInp.value) return toast("Укажите предмет и дату", "err");
          ev.target.disabled = true;
          ev.target.textContent = "⏳ Строю план и ставлю в расписание…";
          try {
            const res = await api("/api/g/plan", {
              method:"POST",
              body:{ subject: subjInp.value.trim(), date: dateInp.value, time: timeInp.value, push_to_tt: true }
            });
            pick("success");
            toast(`План готов! Добавлено слотов в расписание: ${res.added_to_tt}`, "ok");
            render();
          } catch (e) { toast(e.message, "err"); }
          ev.target.disabled = false;
          ev.target.textContent = "🗓 Построить план и добавить в «Пары»";
        }
      }, "🗓 Построить план и добавить в «Пары»"),
      (st.plan && st.plan.length) ? h("div", { class:"stack", style:{marginTop:"8px"} },
        ...st.plan.slice(0, 14).map(p =>
          h("div", { class:"row", style:{padding:"8px 10px", background:"var(--surface-2)", borderRadius:"10px", border: p.d === st.today ? "1px solid #a3e635" : "1px solid var(--line)"} },
            h("span", { class:"chip " + (p.d === st.today ? "green" : "gray") }, fmtShort(p.d)),
            h("span", { class:"grow", style:{fontSize:"0.88rem"} }, p.t)
          )
        )
      ) : null
    )
  );

  return box;
}

async function renderGrowthSocialPane(st) {
  const b = await api("/api/g/board");
  const box = h("div", { class:"g-shell" });

  // 1. ДУЭЛЬ ЗНАНИЙ 1 НА 1 ПО ССЫЛКЕ
  const duelTopicInp = h("input", { type:"text", placeholder:"Тема дуэли (напр., Производные, Python, История)…" });
  const duelCodeInp = h("input", { type:"text", placeholder:"Код дуэли от друга…" });

  box.append(
    h("div", { class:"g-sec-head" },
      h("h2", {}, "Дуэль знаний (5 вопросов)"),
      h("span", { class:"num" }, "+25 XP")
    ),
    h("div", { class:"card stack" },
      h("div", { class:"row" },
        h("div", { class:"grow" }, duelTopicInp),
        h("button", {
          class:"btn small",
          onclick: async (ev) => {
            const t = duelTopicInp.value.trim();
            if (!t) return toast("Введите тему дуэли", "err");
            ev.target.disabled = true;
            try {
              const res = await api("/api/g/duel", { method:"POST", body:{ topic: t } });
              openDuelModal(res.id);
            } catch (e) { toast(e.message, "err"); }
            ev.target.disabled = false;
          }
        }, "⚔️ Создать")
      ),
      h("div", { class:"row" },
        h("div", { class:"grow" }, duelCodeInp),
        h("button", {
          class:"btn ghost small",
          onclick: () => {
            if (!duelCodeInp.value.trim()) return toast("Введите код дуэли", "err");
            openDuelModal(duelCodeInp.value.trim());
          }
        }, "Войти по коду")
      )
    )
  );

  // 2. КОМНАТА ГРУППЫ / ПОТОКА + ОБЩИЕ ДЕДЛАЙНЫ
  box.append(
    h("div", { class:"g-sec-head" },
      h("h2", {}, b.title || "Лидерборд группы"),
      h("button", {
        class:"chip",
        onclick: () => {
          sheet("👥 Комната учебной группы", (close) => {
            const codeInp = h("input", { type:"text", value: b.code || "", placeholder:"Код комнаты (напр., FPM-101)" });
            const titleInp = h("input", { type:"text", placeholder:"Название группы (если создаёте новую)" });
            return h("div", { class:"stack" },
              h("div", { class:"sub" }, "Один человек создаёт код комнаты и ведёт общие дедлайны — одногруппники вводят этот же код и видят общий лидерборд и дедлайны."),
              field("Инвайт-код группы", codeInp),
              field("Название потока / группы", titleInp),
              h("button", {
                class:"btn block",
                onclick: async () => {
                  await api("/api/g/group/join", { method:"POST", body:{ code: codeInp.value.trim(), title: titleInp.value.trim() } });
                  pick("success"); close(); render();
                }
              }, "Подключиться к группе")
            );
          });
        }
      }, b.code ? `🔑 Код: ${b.code}` : "➕ Войти в группу")
    )
  );

  // Общие дедлайны группы
  if (b.has) {
    box.append(
      h("div", { class:"card stack" },
        h("div", { class:"row between" },
          h("div", { style:{fontWeight:800} }, "📌 Общие дедлайны потока"),
          b.owner ? h("span", { class:"chip green" }, "Вы староста/ведущий") : h("span", { class:"chip gray" }, "Подписка")
        ),
        (b.dl && b.dl.length)
          ? h("div", { class:"stack" }, ...b.dl.map(x =>
              h("div", { class:"row between", style:{padding:"7px 10px", background:"var(--surface-2)", borderRadius:"8px"} },
                h("span", { style:{fontWeight:600, fontSize:"0.9rem"} }, x.t),
                h("span", { class:"chip warn" }, fmtShort(x.d))
              )
            ))
          : h("div", { class:"sub" }, "Общих дедлайнов пока нет."),
        b.owner ? h("button", {
          class:"btn ghost small block",
          onclick: () => {
            sheet("📢 Добавить дедлайн для всей группы", (close) => {
              const tInp = h("input", { type:"text", placeholder:"Что сдаём (напр., Коллоквиум по матану)" });
              const dInp = h("input", { type:"date", value: addDays(st.today, 7) });
              return h("div", { class:"stack" },
                field("Событие или дедлайн", tInp),
                field("Дата", dInp),
                h("button", {
                  class:"btn block",
                  onclick: async () => {
                    await api("/api/g/group/dl", { method:"POST", body:{ t: tInp.value.trim(), d: dInp.value } });
                    pick("success"); close(); render();
                  }
                }, "Опубликовать для группы")
              );
            });
          }
        }, "➕ Добавить общий дедлайн") : null
      )
    );
  }

  // Лидерборд участников
  box.append(
    h("div", { class:"stack" },
      ...(b.rows || []).map((r, i) =>
        h("div", { class: "g-rank-row" + (r.me ? " me" : "") },
          h("span", { class:"g-rank-pos" }, i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `#${i + 1}`),
          renderAvatar(r.avatar || "🧑‍💻", "sm"),
          h("div", { class:"grow" },
            h("div", { style:{fontWeight:800, fontSize:"0.92rem"} }, r.name),
            h("div", { class:"sub" }, `Уровень ${r.level || 1} · 🔥 ${r.streak} дн.`)
          ),
          h("span", { class:"chip green mono" }, `${r.xp} XP`)
        )
      )
    )
  );

  return box;
}

const VIEWS = {
  home: viewHome,
  tt: viewTT,
  tasks: viewTasks,
  study: viewStudy,
  growth: viewGrowth,
  chat: viewChat
};

async function boot() {
  drawNav();
  try {
    S.me = await api("/api/me");
    if (S.me && S.me.account && S.me.account.id) {
      setActiveAccountId(S.me.account.id);
    }
    S.today = (S.me && S.me.now ? S.me.now.slice(0, 10) : "") || iso(new Date());
    if (!S.ttDate) S.ttDate = S.today;

    // Авто-запуск дуэли по ссылке ?startapp=duel_XXXX или ?duel=XXXX
    const startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param)
      || new URLSearchParams(location.search).get("duel") || "";
    if (startParam.startsWith("duel_")) {
      S.tab = "growth";
      S.growthSub = "social";
      drawNav();
      setTimeout(() => openDuelModal(startParam.slice(5)), 350);
    } else if (startParam) {
      setTimeout(() => openDuelModal(startParam), 350);
    }

    await render();
  } catch (e) {
    document.getElementById("view").replaceChildren(
      h("div", { class:"card" },
        h("h3", {}, "Ошибка подключения"),
        h("p", { class:"sub", style:{marginTop:"6px"} }, e.message),
        h("button", { class:"btn block", style:{marginTop:"12px"}, onclick: boot }, "🔄 Повторить")
      )
    );
  }
}

boot();
</script>
