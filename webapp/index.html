      h("button", { class:"btn", onclick: () => taskCreateForm(availGroups) }, "➕ Создать задачу")));
    appendUi(root, h("button", { class:"fab", onclick: () => taskCreateForm(availGroups), title:"Добавить задачу" }, "+"));
    return root;
  }

  let countTimers = 0, countReminders = 0, countRegular = 0;
  (d.groups || []).forEach(g => (g.topics || []).forEach(tp => (tp.tasks || []).forEach(t => {
    const ki = getTaskKindInfo(t);
    if (ki.id === "timer") countTimers++;
    else if (ki.id === "reminder") countReminders++;
    else countRegular++;
  })));

  appendUi(root, h("div", { class:"top-plank" },
    h("div", { class:"plank-left" },
      h("div", { class:"plank-ic" }, "🗂"),
      h("div", { class:"grow" },
        h("div", { class:"plank-title" }, "Группы › Темы › Задачи"),
        h("div", { class:"plank-sub" },
          "📝 " + countRegular + " · 🔔 " + countReminders + " · ⏲ " + countTimers)
      )
    ),
    h("span", { class:"chip" }, "по дате ↑")
  ));

  const topBurningSlot = h("div", {});
  appendUi(root, topBurningSlot);

  const search = h("input", { type:"search", placeholder:"Поиск по группе, теме или тексту…",
    value: S.tasksQuery,
    oninput: (e) => { S.tasksQuery = e.target.value.toLowerCase(); applyFilters(); } });
  appendUi(root, h("div", { class:"search-wrap" },
    h("span", { class:"icon" }, "🔍"), search));

  const filters = [["all","Все сроки"],["urgent","🔥 Срочные"],["week","📅 Эта неделя"],["no-date","Без срока"]];
  const filterRow = h("div", { class:"chips", style:{ marginBottom:"8px", marginTop:"-4px" } });
  filters.forEach(([id, label]) => {
    appendUi(filterRow, h("button", {
      class: "chip " + (S.tasksFilter === id ? "" : "gray"),
      onclick: () => { S.tasksFilter = id; drawTasksFilter(); applyFilters(); },
      "data-filter": id
    }, label));
  });
  appendUi(root, filterRow);

  const kindFilters = [
    ["all", "Все типы"],
    ["regular", "📝 Обычные"],
    ["reminder", "🔔 Напоминания"],
    ["timer", "⏲ Таймеры"]
  ];
  const kindRow = h("div", { class:"chips", style:{ marginBottom:"14px" } });
  kindFilters.forEach(([id, label]) => {
    appendUi(kindRow, h("button", {
      class: "chip " + (S.tasksKindFilter === id ? "" : "gray"),
      onclick: () => { S.tasksKindFilter = id; drawTasksFilter(); applyFilters(); },
      "data-kind": id
    }, label));
  });
  appendUi(root, kindRow);

  function drawTasksFilter() {
    filterRow.querySelectorAll("button").forEach(b => {
      b.classList.toggle("gray", b.dataset.filter !== S.tasksFilter);
    });
    kindRow.querySelectorAll("button").forEach(b => {
      b.classList.toggle("gray", b.dataset.kind !== S.tasksKindFilter);
    });
  }

  const listWrap = h("div", {});
  appendUi(root, listWrap);

  function renderBurningBanner() {
    const activeBurning = [];
    (d.groups || []).forEach(g => (g.topics || []).forEach(tp => (tp.tasks || []).forEach(t => {
      if (isBurning30Min(t)) activeBurning.push(t);
    })));
    if (!activeBurning.length) {
      replaceUi(topBurningSlot, );
      return;
    }
    activeBurning.sort((a, b) => getTaskTimestamp(a) - getTaskTimestamp(b));
    const nearest = activeBurning[0];
    replaceUi(topBurningSlot,
      h("div", { class:"burning-banner" },
        h("div", { class:"grow" },
          h("div", { class:"burn-title" }, "🔥 Горят дедлайны! (< 30 мин)"),
          h("div", { class:"sub truncate", style:{marginTop:"2px", color:"inherit", opacity:.9} }, nearest.text)
        ),
        h("span", { class:"burn-time", "data-burn-task": nearest.id }, fmtRemainingTime(nearest))
      )
    );
  }

  function applyFilters() {
    const q = S.tasksQuery.trim();
    const filter = S.tasksFilter;
    const kindFilter = S.tasksKindFilter;
    const now = new Date();
    const weekEnd = new Date(now.getTime() + 7 * 86400 * 1000);
    replaceUi(listWrap, );
    let shown = 0;

    const groupedMap = new Map();
    (d.groups || []).forEach(g => {
      const gTitle = g.title || "Без группы";
      if (!groupedMap.has(gTitle)) groupedMap.set(gTitle, []);
      const topicList = groupedMap.get(gTitle);
      (g.topics || []).forEach(tp => {
        let existingTp = topicList.find(x => x.name === tp.name);
        if (!existingTp) {
          existingTp = { name: tp.name || "Общее", tasks: [] };
          topicList.push(existingTp);
        }
        existingTp.tasks.push(...(tp.tasks || []));
      });
    });

    let groupIndex = 0;
    for (const [gTitle, topics] of groupedMap.entries()) {
      const topicNodes = [];
      let groupTaskCount = 0;
      let groupBurningCount = 0;

      topics.forEach((tp, ti) => {
        const filtered = tp.tasks.filter(t => {
          const ki = getTaskKindInfo(t);
          if (kindFilter !== "all" && ki.id !== kindFilter) return false;
          if (q && !t.text.toLowerCase().includes(q) &&
              !(tp.name || "").toLowerCase().includes(q) &&
              !gTitle.toLowerCase().includes(q)) return false;
          if (filter === "urgent" && !t.overdue && !t.soon && !isBurning30Min(t)) return false;
          if (filter === "week") {
            const dObj = parseTaskDateObj(t);
            if (!dObj || dObj < now || dObj > weekEnd) return false;
          }
          if (filter === "no-date" && parseTaskDateObj(t)) return false;
          return true;
        });

        if (!filtered.length) return;
        filtered.sort((a, b) => getTaskTimestamp(a) - getTaskTimestamp(b));

        shown += filtered.length;
        groupTaskCount += filtered.length;

        const topicBurning = filtered.filter(t => isBurning30Min(t));
        groupBurningCount += topicBurning.length;

        const taskElements = [];
        let lastDayKey = null;

        filtered.forEach(t => {
          const dayKey = parseTaskDateObj(t) ? fmtDayDDMM(t) : "Без даты";
          if (dayKey !== lastDayKey) {
            lastDayKey = dayKey;
            taskElements.push(
              h("div", { class:"date-divider" },
                h("span", { class:"date-pill" },
                  dayKey === "Без даты" ? "📌 Без срока" : "📅 " + dayKey),
                h("span", { class:"date-line" })
              )
            );
          }

          const kindInfo = getTaskKindInfo(t);
          const burning = isBurning30Min(t);
          const urgent = burning || t.overdue ? "red" : t.soon ? "warn" : "gray";
          const txt = h("div", { class:"text", onclick: () => txt.classList.toggle("open") }, t.text);

          taskElements.push(
            h("div", { class:"task-card" + (burning ? " burning" : "") },
              h("div", { class:"task-plank " + (burning ? "kind-burning" : kindInfo.cls) },
                h("span", {}, kindInfo.icon + " " + kindInfo.label),
                t.deadline || t.deadline_iso
                  ? h("span", { class:"mono" }, (t.overdue ? "⏰ просрочено · " : "до ") + fmtDeadline(t))
                  : h("span", { class:"mute" }, "без дедлайна")
              ),
              h("div", { class:"task-body" },
                txt,
                h("div", { class:"chips" },
                  (t.deadline || t.deadline_iso) ? h("span", { class:"chip " + urgent },
                    "📅 " + fmtDayDDMM(t)) : null,
                  t.kind === "timer" ? h("span", { class:"chip purple", "data-burn-task": t.id },
                    parseTaskDateObj(t) ? "⏳ " + fmtRemainingTime(t) : "⏲ таймер") : null,
                  t.notif ? h("span", { class:"chip cyan" }, "🔔 уведомление") : null,
                  t.file ? h("span", { class:"chip gray" }, "📎 " + t.file) : null,
                  (t.done_by && t.done_by.length) ? h("span", { class:"chip green" }, "👥 " + t.done_by.length) : null
                ),
                h("div", { class:"footer" },
                  h("button", { class:"btn small block", onclick: async () => {
                    await api("/api/tasks/" + t.id + "/done", { method:"POST" });
                    hap("medium"); pick("success"); toast("Готово ✅", "ok"); render();
                  }}, "✅ Выполнено"))
              )
            )
          );
        });

        const topicDet = h("details", { class:"topic-acc", open: groupIndex === 0 && ti === 0 },
          h("summary", {},
            h("div", { class:"topic-dot" }, "🏷"),
            h("span", { class:"grow truncate" }, tp.name),
            topicBurning.length ? h("span", { class:"chip red" }, "🔥 " + topicBurning.length) : null,
            h("span", { class:"chip gray" }, filtered.length),
            h("span", { class:"chev" })
          ),
          h("div", { class:"topic-body" }, ...taskElements)
        );
        topicNodes.push(topicDet);
      });

      if (!topicNodes.length) return;

      const groupDet = h("details", { class:"group-acc", open: groupIndex === 0 },
        h("summary", {},
          h("div", { class:"group-icon" }, "📂"),
          h("div", { class:"group-meta" },
            h("div", { class:"g-title truncate" }, gTitle),
            h("div", { class:"g-sub" }, "Тем: " + topicNodes.length + " · Задач: " + groupTaskCount)
          ),
          groupBurningCount ? h("span", { class:"chip red" }, "🔥") : null,
          h("span", { class:"chip" }, groupTaskCount),
          h("span", { class:"chev" })
        ),
        h("div", { class:"group-body" }, ...topicNodes)
      );

      appendUi(listWrap, groupDet);
      groupIndex++;
    }

    if (!shown) {
      appendUi(listWrap, empty("🔍", "Ничего не найдено", "Попробуй изменить запрос или фильтр"));
    }
  }

  renderBurningBanner();
  applyFilters();

  S.timerInterval = setInterval(() => {
    const allTasks = [];
    (d.groups || []).forEach(g => (g.topics || []).forEach(tp => (tp.tasks || []).forEach(t => allTasks.push(t))));
    document.querySelectorAll("[data-burn-task]").forEach(el => {
      const tid = el.getAttribute("data-burn-task");
      const taskObj = allTasks.find(x => String(x.id) === String(tid));
      if (taskObj) el.textContent = fmtRemainingTime(taskObj);
    });
  }, 1000);

  appendUi(root, h("button", { class:"fab", onclick: () => taskCreateForm(availGroups), title:"Добавить задачу" }, "+"));
  return root;
}

      h("div", { class:"btn-row", style:{marginTop:"10px"} },
        h("button", { class:"btn ghost small", onclick: cardForm }, "➕ Добавить / ИИ-генерация"),
        h("button", { class:"btn subtle small", disabled: !c.total, onclick: () => session(null) }, "🔀 Микс всех тем")
      ))));

  // Группируем карточки строго по темам (deck)
  const decksMap = new Map();
  allCards.forEach(card => {
    const dName = (card.deck || "общее").trim();
    if (!decksMap.has(dName)) decksMap.set(dName, []);
    decksMap.get(dName).push(card);
  });

  appendUi(box, h("h2", {}, `Темы и колоды (${decksMap.size})`));

  for (const [deckName, deckCards] of decksMap.entries()) {
    const dueCount = deckCards.filter(x => !x.due || x.due <= S.today).length;
    const learnedCount = deckCards.filter(x => (x.box || 1) >= 4).length;

    appendUi(box,
      h("details", { class:"group-acc" },
        h("summary", {},
          h("div", { class:"group-icon" }, "📚"),
          h("div", { class:"group-meta" },
            h("div", { class:"g-title" }, deckName),
            h("div", { class:"g-sub" }, `Карточек: ${deckCards.length} · К повтору: ${dueCount} · Выучено: ${learnedCount}`)
          ),
          h("button", {
            class:"btn small",
            onclick: (ev) => {
              ev.preventDefault();
              ev.stopPropagation();
              session(deckName);
            }
          }, dueCount ? `▶️ Учить (${dueCount})` : "🔁 Повторить"),
          h("span", { class:"chev" })
        ),
        h("div", { class:"group-body" },
          ...deckCards.map(k =>
            h("div", { class:"card tight", style:{marginBottom:0} },
              h("div", { class:"row between" },
                h("div", { class:"grow" },
                  h("div", { style:{fontWeight:700} }, cleanMathUi(k.front)),
                  k.ph ? h("div", { class:"sub", style:{marginTop:"2px"} }, k.ph) : null,
                  h("div", { style:{marginTop:"4px", color:"var(--text-2)"} }, cleanMathUi(k.back)),
                  h("div", { class:"chips" },
                    h("span", { class:"chip gray" }, "коробка " + k.box),
                    k.due ? h("span", { class:"chip " + (k.due <= S.today ? "warn" : "green") }, "повтор: " + fmtShort(k.due)) : null
                  )
                ),
                h("button", {
                  class:"btn danger small icon",
                  title:"Удалить карточку",
                  onclick: async () => {
                    if (!confirm("Удалить карточку?")) return;
                    await api("/api/cards/" + k.id, { method:"DELETE" });
                    render();
                  }
                }, "🗑")
              )
            )
          )
        )
      )
    );
  }

  return box;
}

async function session(deckFilter) {
  const allRes = await api("/api/cards", { fresh: true });
  let poolCards = allRes.cards || [];
  if (deckFilter) {
    poolCards = poolCards.filter(c => (c.deck || "общее").trim() === deckFilter);
  }
  if (!poolCards.length) return toast("В этой теме пока нет карточек");

  let dueCards = poolCards.filter(c => !c.due || c.due <= S.today);
  let q = (dueCards.length ? dueCards : [...poolCards].sort(() => Math.random() - 0.5)).slice(0, 12);

  let seen = 0, ok = 0;
  const again = new Set();
  const historyStack = [];
  const totalStart = q.length;
  const titleStr = deckFilter ? `Тема: ${deckFilter}` : "Повторение (все темы)";

  sheet(titleStr, (close) => {
    const body = h("div");
    const step = () => {
      if (!q.length) {
        replaceUi(body,
          h("div", { class:"empty" },
            h("div", { class:"big" }, "🏁"),
            h("h3", {}, "Сессия завершена!"),
            h("p", {}, `Тема: ${deckFilter || "Общая"} · Знал ${ok} из ${seen}`),
            h("div", { class:"btn-row" },
              historyStack.length ? h("button", { class:"btn ghost", onclick: undoLast }, "↩️ Отменить последний ответ") : null,
              h("button", { class:"btn", onclick: () => { close(); render(); } }, "Готово")
            )
          )
        );
        return;
      }
      const k = q[0];
      const done = Math.max(0, totalStart - q.length);
      const pct = Math.min(100, Math.round(100 * done / totalStart));
      const btns = h("div", { class:"btn-row", style:{ display:"none" } },
        h("button", { class:"btn danger", onclick: () => answer(false) }, "❌ Не знал"),
        h("button", { class:"btn", onclick: () => answer(true) }, "✅ Знал"));

      const card = h("div", { class:"flip", onclick: () => {
        card.classList.add("on"); hap();
        btns.style.display = "flex";
      }},
        h("div", { class:"in" },
          h("div", { class:"face" },
            h("span", { class:"chip gray", style:{marginBottom:"10px"} }, k.deck || "общее"),
            h("div", { class:"w" }, cleanMathUi(k.front)),
            k.ph && h("div", { class:"ph" }, k.ph),
            h("div", { class:"sub", style:{marginTop:"14px"} }, "нажми, чтобы перевернуть")),
          h("div", { class:"face back" },
            h("div", { class:"w" }, cleanMathUi(k.back)),
            k.ex && h("div", { class:"ex" }, cleanMathUi(k.ex)))));

      const answer = async (known) => {
        const snapshot = {
          card: k,
          prevBox: k.box || 1,
          prevDue: k.due || S.today,
          known,
          wasRequeued: !known && !again.has(k.id)
        };
        historyStack.push(snapshot);
        q.shift();
        seen++;
        ok += known ? 1 : 0;
        if (snapshot.wasRequeued) {
          again.add(k.id);
          q.push(k);
        }
        try { await api("/api/cards/" + k.id + "/review", { method:"POST", body: { known } }); }
        catch (e) { toast(e.message, "err"); }
        hap(known ? "light" : "heavy");
        step();
      };

      replaceUi(body,
        h("div", { class:"session-progress" },
          h("span", {}, (done + 1) + " / " + totalStart),
          h("div", { class:"bar" }, h("i", { style:{ width: pct + "%" } })),
          h("span", {}, "✓ " + ok),
          historyStack.length ? h("button", {
            class:"chip gray",
            onclick: undoLast
          }, "↩️ Шаг назад") : null
        ),
        card,
        btns
      );
    };

    const undoLast = async () => {
      const last = historyStack.pop();
      if (!last) return;
      hap("medium");
      if (last.wasRequeued) {
        const idx = q.lastIndexOf(last.card);
        if (idx !== -1) q.splice(idx, 1);
        again.delete(last.card.id);
      }
      q.unshift(last.card);
      seen = Math.max(0, seen - 1);
      if (last.known) ok = Math.max(0, ok - 1);
      try {
        await api("/api/g/card/undo", {
          method:"POST",
          body:{ id: last.card.id, box: last.prevBox, due: last.prevDue }
        });
      } catch (e) {}
      toast("Ход отменён ↩️");
      step();
    };

    step();
    return body;
  });
}

function runQuizModal(qz) {
  const questions = qz.questions || [];
  if (!questions.length) return toast("Не удалось получить вопросы", "err");
  let idx = 0, score = 0;

  sheet(qz.title || "🎯 Квиз", (close) => {
    const body = h("div", {});
    const step = () => {
      if (idx >= questions.length) {
        const pct = Math.round(100 * score / questions.length);
        replaceUi(body,
          h("div", { class:"empty" },
            h("div", { class:"big" }, pct >= 80 ? "🏆" : pct >= 50 ? "👍" : "📚"),
            h("h3", {}, "Результат: " + score + " из " + questions.length + " (" + pct + "%)"),
            h("p", {}, pct >= 80 ? "Отличный результат!" : "Хорошая тренировка, продолжай в том же духе."),
            h("button", { class:"btn block", onclick: () => { close(); render(); } }, "Готово")
          )
        );
        return;
      }
      const item = questions[idx];
      const optsWrap = h("div", { class:"stack", style:{marginTop:"12px"} });
      const explainBox = h("div", { class:"info-box hidden", style:{marginTop:"12px"} });
      const nextBtn = h("button", { class:"btn block hidden", style:{marginTop:"12px"}, onclick: () => { idx++; step(); } },
        idx + 1 < questions.length ? "Следующий вопрос →" : "Завершить квиз 🏁");

      let answered = false;
      (item.options || []).forEach((optText, oi) => {
        const b = h("button", {
          class:"btn ghost",
          style:{justifyContent:"flex-start", textAlign:"left"},
          onclick: () => {
            if (answered) return;
            answered = true;
            const correctIdx = typeof item.answer === "number" ? item.answer : item.correct;
            const isOk = oi === correctIdx;
            if (isOk) { score++; pick("success"); b.style.borderColor = "var(--ok)"; b.style.background = "var(--ok-soft)"; }
            else { pick("error"); b.style.borderColor = "var(--danger)"; b.style.background = "var(--danger-soft)"; }
            if (item.explain || item.explanation) {
              explainBox.textContent = "💡 " + (item.explain || item.explanation);
              explainBox.classList.remove("hidden");
            }
            nextBtn.classList.remove("hidden");
          }
        }, optText);
        appendUi(optsWrap, b);
      });

      replaceUi(body,
        h("div", { class:"session-progress" },
          h("span", {}, "Вопрос " + (idx + 1) + " / " + questions.length),
          h("div", { class:"bar" }, h("i", { style:{ width: Math.round(100 * idx / questions.length) + "%" } })),
          h("span", {}, "✓ " + score)
        ),
        h("div", { class:"card", style:{marginTop:"8px"} },
          h("div", { style:{fontWeight:700, fontSize:"1.02rem"} }, item.q || item.question),
          optsWrap,
          explainBox,
          nextBtn
        )
      );
    };
    step();
    return body;
  });
}

              )

                } catch (e) { toast(e.message, "err"); }
                ev.target.disabled = false;
              }}, "📨 В ТГ")

        !m.loading && !isMe && m.text ? reactionPicker(m, drawMessages) : null,

          !isMe && m.text ? h("button", { class:"act-btn", onclick: () => exportMessageDoc(m.exportText || m.text, "pdf") }, "📄 PDF") : null,
          !isMe && m.text ? h("button", { class:"act-btn", onclick: () => exportMessageDoc(m.exportText || m.text, "docx") }, "📝 Word") : null,

          }}, "🗑")
        ) : null
      );
      appendUi(listBox, bubble);
    });
  };

  const filesBar = h("div", { class:"chat-files-bar hidden" });
  const drawFilesBar = () => {
    if (!S.chatFiles.length) {
      filesBar.classList.add("hidden");
      replaceUi(filesBar, );
      return;
    }
    filesBar.classList.remove("hidden");
    replaceUi(filesBar, ...S.chatFiles.map((f, i) =>
      h("div", {
        class:"chat-file-chip",
        onclick: () => previewFileModal(f, () => { S.chatFiles.splice(i, 1); drawFilesBar(); })
      },
        h("span", {}, "📎"),
        h("span", { class:"cf-name" }, f.name),
        h("button", {
          onclick: (ev) => { ev.stopPropagation(); S.chatFiles.splice(i, 1); drawFilesBar(); }
        }, "✕")
      )
    ));
  };

  const inp = h("input", {
    type:"text",
    placeholder:"Сообщение для ИИ…",
    onkeydown: (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); } }
  });

  const fileInp = h("input", {
    type:"file", multiple:true, class:"hidden",
    onchange: async (e) => {
      if (!e.target.files || !e.target.files.length) return;
      try {
        const added = await readFilesAsDataURL(e.target.files);
        S.chatFiles.push(...added.slice(0, 5));
        drawFilesBar();
      } catch (err) { toast(err.message, "err"); }
      e.target.value = "";
    }
  });

  const sendBtn = h("button", {
    class:"send-btn",
    onclick: () => {
      if (S.sending && S.abortCtrl) {
        S.abortCtrl.abort();
        return;
      }
      doSend();
    }
  }, "➤");

  function sendQuick(txt) {
    inp.value = txt;
    doSend();
  }

  async function doSend() {
    if (S.sending) return;
    const text = inp.value.trim();
    const filesToSend = [...S.chatFiles];
    if (!text && !filesToSend.length) return;

    inp.value = "";
    S.chatFiles = [];
    drawFilesBar();

    const uId = "u_" + Date.now();
    const bId = "b_" + Date.now();
    const userEntry = {
      id: uId,
      role: "user",
      text: text || "📎 Прикреплён файл",
      attached_files: filesToSend
    };
    const botEntry = { id: bId, role: "bot", text: "", loading: true };
    chatList.push(userEntry, botEntry);
    drawMessages();
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

    S.sending = true;
    S.abortCtrl = new AbortController();
    sendBtn.classList.add("stop");
    sendBtn.textContent = "■";

    try {
      const res = await api("/api/ask", {
        method: "POST",
        body: { text, files: filesToSend, user_msg_id: uId, bot_msg_id: bId },
        signal: S.abortCtrl.signal
      });
      botEntry.loading = false;
      botEntry.text = res.answer || "";
      botEntry.exportText = res.export_text || botEntry.text;
      botEntry.model = res.model;
      botEntry.files = res.files || [];
      botEntry.ts = res.ts;
      if (res.attached_files && res.attached_files.length) {
        userEntry.attached_files = res.attached_files;
      }
      userEntry.ts = res.ts;
      hap("light");
    } catch (err) {
      botEntry.loading = false;
      botEntry.text = err.name === "AbortError" ? "⏹ Запрос остановлен пользователем." : ("❌ Ошибка: " + err.message);
    } finally {
      S.sending = false;
      S.abortCtrl = null;
      sendBtn.classList.remove("stop");
      sendBtn.textContent = "➤";
      drawMessages();
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }
  }

  drawMessages();
  drawFilesBar();

  if (chatList.length) {
    appendUi(wrap, h("div", { class:"row between", style:{marginBottom:"8px"} },
      h("span", { class:"sub" }, "Сообщений в сессии: " + chatList.length),
      h("button", { class:"chip gray", onclick: async () => {
        await api("/api/chat/clear", { method:"POST" });
        chatList.length = 0;
        drawMessages();
        toast("Диалог очищен 🧹", "ok");
      }}, "🧹 Очистить диалог")
    ));
  }

  appendUi(wrap,
    listBox,
    h("div", { class:"chat-dock" },
      filesBar,
      h("div", { class:"chatbar" },
        h("label", { class:"attach-btn", title:"Прикрепить файл" }, "📎", fileInp),
        inp,
        sendBtn
      )
    )
  );
  return wrap;
}

async function chatSettingsPane() {

  ));

    ["detailed", "📚 Подробный и развёрнутый"],
    ["short", "⚡ Кратко и по делу"]
  ].map(([v, l]) => h("option", { value: v, selected: s.answer_mode === v }, l)));

  const profileArea = h("textarea", { placeholder:"Кратко о себе (курс, направление, интересы)…" }, s.user_profile || "");
  const instrArea = h("textarea", { placeholder:"Как ИИ должен отвечать (тон, язык, формат)…" }, s.custom_instructions || "");
  const readmeArea = h("textarea", {
    class:"readme-box",
    placeholder:"# Персональный README.md\nСюда можно вставить полное досье об аккаунте — ИИ знает его с первого сообщения."
  }, s.user_readme || "");

  const readmeFileInp = h("input", {
    type:"file", accept:".md,.txt", class:"hidden",
    onchange: (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        readmeArea.value = String(reader.result || "");
        toast("README загружен из файла 📄", "ok");
      };
      reader.readAsText(f, "utf-8");
    }
  });

  appendUi(box, h("div", { class:"card stack" },
    field("Режим ответов", modeSel),
    field("О пользователе", profileArea),
    field("Кастомные инструкции", instrArea),
    h("div", { class:"field" },
      h("div", { class:"row between" },
        h("label", {}, "📄 Досье профиля (README.md)"),
        h("label", { class:"chip", style:{cursor:"pointer"} }, "📂 Загрузить .md", readmeFileInp)
      ),
      readmeArea
    ),
    h("button", { class:"btn block", onclick: async (e) => {
      e.target.disabled = true;
      try {
        await api("/api/settings", {
          method:"POST",
          body: {
            answer_mode: modeSel.value,
            user_profile: profileArea.value,
            custom_instructions: instrArea.value,
            user_readme: readmeArea.value
          }
        });
        pick("success"); toast("Настройки сохранены ✅", "ok");
      } catch (err) { toast(err.message, "err"); }
      e.target.disabled = false;
    }}, "💾 Сохранить настройки")
  ));

  if (s.keys && s.keys.length) {
    appendUi(box, h("h2", {}, "Состояние пула API-ключей"));
    s.keys.forEach(line => {
      appendUi(box, h("div", { class:"key-card mono" }, line));
    });
  }

  return box;
}

function buildCompanionSvg(stage, atRisk, streak, onClickCustom) {
  const wrap = h("div", { class:"g-companion-stage", title:"Нажми, чтобы открыть эволюцию острова" });
  const leafColor = atRisk ? "#f59e0b" : "#a3e635";
  const leafDark = atRisk ? "#d97706" : "#10b981";
  const glowColor = atRisk ? "rgba(245,158,11,0.28)" : "rgba(163,230,53,0.28)";

  wrap.innerHTML = `
  <svg viewBox="0 0 200 200" class="g-float-island">
    <defs>
      <radialGradient id="gOrb_${stage}" cx="50%" cy="45%" r="50%">
        <stop offset="0%" stop-color="${glowColor}"/>
        <stop offset="100%" stop-color="transparent"/>
      </radialGradient>
      <linearGradient id="gIsland_${stage}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#334155"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
    </defs>
    <circle cx="100" cy="95" r="82" fill="url(#gOrb_${stage})"/>
    <path d="M38 135 Q100 152 162 135 L138 168 Q100 184 62 168 Z" fill="url(#gIsland_${stage})" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <ellipse cx="100" cy="135" rx="62" ry="12" fill="${leafDark}" opacity="0.88"/>
    ${getTreeStageArt(stage, leafColor, leafDark, atRisk)}
    ${atRisk ? `
      <g opacity="0.92">
        <path d="M70 32 Q85 18 105 24 Q125 18 135 34 Q145 42 130 48 L72 48 Q58 40 70 32 Z" fill="#475569"/>
        <path d="M98 48 L90 62 L100 62 L94 76" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
    ` : `
      <circle cx="48" cy="68" r="3" fill="#a3e635" class="g-sparkle"/>
      <circle cx="152" cy="64" r="2.5" fill="#38bdf8" class="g-sparkle"/>
      <circle cx="136" cy="112" r="2.2" fill="#fef08a" class="g-sparkle"/>
    `}
  </svg>`;

  wrap.addEventListener("click", () => {
    hap("medium");
    if (onClickCustom) onClickCustom();
  });
  return wrap;
}

function openLevelModal(st) {
  const comp = st.companion || { stage: 1, roadmap: [] };
  const roadmap = comp.roadmap || [
    { stage: 1, min_lvl: 1, title: "Семя Импульса", desc: "Пробуждение био-ядра в кратере острова." },
    { stage: 2, min_lvl: 2, title: "Неоновый Росток", desc: "Молодое деревце с парящими кристаллами." },
    { stage: 3, min_lvl: 4, title: "Древо Синтеза", desc: "Развилистая крона и глубокие корни." },
    { stage: 4, min_lvl: 7, title: "Кристальная Роща", desc: "Роща из трёх деревьев и эфирный водопад." },
    { stage: 5, min_lvl: 12, title: "Парящий Эдем", desc: "Золотая корона и двойные орбитальные кольца." },
    { stage: 6, min_lvl: 20, title: "Древо Сингулярности", desc: "Космическое древо с галактическим порталом." }
  ];

  sheet(`⚡ Уровень ${st.level} · История XP и Эволюция`, (close) => {
    const xpLog = st.xp_log || [];
    return h("div", { class:"stack" },
      h("div", { class:"card tight row between", style:{marginBottom:0} },
        h("div", {},
          h("div", { style:{fontWeight:900, fontSize:"1.15rem"} }, `Уровень ${st.level} (${st.xp} XP)`),
          h("div", { class:"sub" }, `До уровня ${st.level + 1} осталось ${100 - (st.xp_in_level || 0)} XP`)
        ),
        h("span", { class:"chip green" }, `🔥 Серия ${st.streak} дн.`)
      ),

      h("h2", { style:{margin:"8px 0 2px"} }, "🌳 Эволюция Древа (Стадии 1–6)"),
      h("div", { class:"sub", style:{marginBottom:"4px"} }, "Каждая новая стадия открывается с ростом твоего уровня или серии дней:"),
      h("div", { class:"stack" },
        ...roadmap.map(rm => {
          const unlocked = rm.stage <= comp.stage;
          const isCurrent = rm.stage === comp.stage;
          return h("div", {
            class:"card tight row",
            style:{
              marginBottom:0,
              gap:"12px",
              border: isCurrent ? "1.5px solid #84cc16" : "1px solid var(--line)",
              opacity: unlocked ? 1 : 0.65
            }
          },
            h("div", { style:{width:"74px", height:"74px", flex:"none", display:"flex", alignItems:"center", justifyContent:"center"} },
              buildCompanionSvg(rm.stage, false, st.streak)
            ),
            h("div", { class:"grow" },
              h("div", { class:"row between wrap" },
                h("span", { style:{fontWeight:800, fontSize:"0.95rem"} }, `${rm.stage}. ${rm.title}`),
                isCurrent
                  ? h("span", { class:"chip green" }, "Текущее")
                  : (unlocked ? h("span", { class:"chip gray" }, "Открыто ✓") : h("span", { class:"chip warn" }, `🔒 с Ур. ${rm.min_lvl}`))
              ),
              h("div", { class:"sub", style:{marginTop:"4px"} }, rm.desc)
            )
          );
        })
      ),

      h("h2", { style:{margin:"10px 0 2px"} }, "📜 За что получен опыт (Лог XP)"),
      xpLog.length ? h("div", { class:"stack" },
        ...xpLog.slice(0, 25).map(item =>
          h("div", { class:"row between", style:{padding:"8px 11px", background:"var(--surface-2)", borderRadius:"10px", border:"1px solid var(--line)"} },
            h("div", { class:"grow" },
              h("div", { style:{fontWeight:700, fontSize:"0.88rem"} }, item.label || item.kind),
              h("div", { class:"sub", style:{fontSize:"0.75rem"} }, `Уровень ${item.lvl || 1} · ${item.d || ""}`)
            ),
            h("span", { class:"chip " + (item.xp >= 0 ? "green" : "red") + " mono" },
              (item.xp >= 0 ? "+" : "") + item.xp + " XP")
          )
        )
      ) : h("div", { class:"sub" }, "Выполни любое действие (карточки, привычку, задачу или рефлексию), и здесь появится подробная история начислений XP."),

      h("button", { class:"btn block", onclick: close }, "Закрыть")
    );
  });
}

async function generateStoryCardModal(st) {
  sheet("📸 Шэр-карточка для Сторис", (close) => {
    const canvas = h("canvas", {
      width: 1080, height: 1920,
      style: { width:"100%", maxWidth:"290px", borderRadius:"18px", border:"1px solid var(--line-2)", display:"block", margin:"0 auto" }
    });
    const ctx = canvas.getContext("2d");
    const stage = (st.companion && st.companion.stage) || 1;
    const stageTitle = (st.companion && st.companion.title) || "Семя Импульса";

    // 1. Глубокий атмосферный фон
    const grad = ctx.createLinearGradient(0, 0, 1080, 1920);
    grad.addColorStop(0, "#050811");
    grad.addColorStop(0.48, "#0c1c1a");
    grad.addColorStop(1, "#04060b");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1080, 1920);

    // Свечение за островом
    const rad = ctx.createRadialGradient(540, 650, 30, 540, 650, 480);
    rad.addColorStop(0, "rgba(163, 230, 53, 0.34)");
    rad.addColorStop(0.6, "rgba(16, 185, 129, 0.12)");
    rad.addColorStop(1, "transparent");
    ctx.fillStyle = rad;
    ctx.fillRect(0, 0, 1080, 1920);

    // Внешняя тонкая рамка с безопасными отступами
    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.lineWidth = 3;
    ctx.strokeRect(70, 70, 940, 1780);

    // Центрированная шапка
    ctx.textAlign = "center";
    ctx.fillStyle = "#a3e635";
    ctx.font = "800 30px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(`DAILY GROWTH PROTOCOL  ·  STAGE ${stage}/6`, 540, 165);

    ctx.fillStyle = "#ffffff";
    ctx.font = "900 68px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText((st.name || "АРТЁМ").toUpperCase().slice(0, 18), 540, 255);

    // Детальная иллюстрация парящего острова и дерева
    ctx.save();
    ctx.translate(540, 690);
    // Каменная порода парящего острова
    ctx.fillStyle = "#1e293b";
    ctx.beginPath();
    ctx.moveTo(-240, 120);
    ctx.quadraticCurveTo(0, 175, 240, 120);
    ctx.lineTo(175, 245);
    ctx.quadraticCurveTo(0, 295, -175, 245);
    ctx.closePath();
    ctx.fill();
    // Био-плато острова
    ctx.fillStyle = "#10b981";
    ctx.beginPath();
    ctx.ellipse(0, 120, 240, 42, 0, 0, Math.PI * 2);
    ctx.fill();
    // Энергетические орбиты
    ctx.strokeStyle = "rgba(163,230,53,0.55)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(0, -10, 260, 75, -0.18, 0, Math.PI * 2);
    ctx.stroke();
    // Крона дерева (многослойная)
    ctx.fillStyle = "#059669";
    ctx.beginPath();
    ctx.arc(-110, -10, 105, 0, Math.PI * 2);
    ctx.arc(110, -10, 105, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#10b981";
    ctx.beginPath();
    ctx.arc(-65, -75, 110, 0, Math.PI * 2);
    ctx.arc(65, -75, 110, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#a3e635";
    ctx.beginPath();
    ctx.arc(0, -105, 125, 0, Math.PI * 2);
    ctx.fill();
    // Ствол и ветви
    ctx.strokeStyle = "#f1f5f9";
    ctx.lineWidth = 26;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(0, 125);
    ctx.lineTo(0, -45);
    ctx.stroke();
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(0, 35);
    ctx.lineTo(-65, -25);
    ctx.moveTo(0, 15);
    ctx.lineTo(65, -40);
    ctx.stroke();
    ctx.restore();

    // Крупный счётчик серии по центру
    ctx.fillStyle = "#a3e635";
    ctx.font = "900 220px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(`${st.streak} 🔥`, 540, 1210);

    // Подпись стадии (авто-масштабирование, чтобы НИКОГДА не вылезала за края)
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "800 38px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("ДНЕЙ БЕЗ ПРОПУСКОВ", 540, 1285);
    ctx.fillStyle = "#a3e635";
    ctx.font = "700 34px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(`СТАДИЯ: ${stageTitle.toUpperCase()}`, 540, 1340);

    // Карточка статов по центру
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fillRect(140, 1410, 800, 220);
    ctx.strokeStyle = "rgba(163,230,53,0.35)";
    ctx.lineWidth = 2;
    ctx.strokeRect(140, 1410, 800, 220);

    ctx.fillStyle = "#ffffff";
    ctx.font = "900 62px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(`УРОВЕНЬ ${st.level}  ·  ${st.xp} XP`, 540, 1505);

    const totalFire = (st.goals || []).reduce((acc, g) => acc + (g.fire || (g.days || []).length), 0);
    ctx.fillStyle = "#94a3b8";
    ctx.font = "700 34px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(`Огоньков привычек: 🔥 ${totalFire}   |   Заморозок: ❄️ ${st.freeze}`, 540, 1575);

    ctx.fillStyle = "#64748b";
    ctx.font = "700 32px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(st.bot ? "@" + st.bot + "  ·  " + st.today : "Telegram Mini App  ·  " + st.today, 540, 1785);

    return h("div", { class:"stack", style:{marginTop:"10px"} },
      canvas,
      h("button", {
        class:"btn block",
        onclick: async (ev) => {
          ev.target.disabled = true;
          ev.target.textContent = "⏳ Отправляю в чат бота…";
          try {
            await api("/api/g/story_image", {
              method:"POST",
              body:{ data_url: canvas.toDataURL("image/png"), send_tg: true }
            });
            pick("success");
            toast("Картинка отправлена в чат бота! 📨", "ok");
          } catch (e) { toast(e.message, "err"); }
          ev.target.disabled = false;
          ev.target.textContent = "📨 Прислать картинку в чат бота";
        }
      }, "📨 Прислать картинку в чат бота"),
      h("button", {
        class:"btn ghost block",
        onclick: async (ev) => {
          ev.target.disabled = true;
          try {
            const r = await api("/api/g/story_image", {
              method:"POST",
              body:{ data_url: canvas.toDataURL("image/png"), send_tg: false }
            });
            const dlUrl = location.origin + "/api/files/" + r.id + "?initData=" + encodeURIComponent(getInitData()) + "&acc=" + encodeURIComponent(getActiveAccountId()) + "&client=tg";
            if (tg && tg.openLink) tg.openLink(dlUrl);
            else window.open(dlUrl, "_blank");
          } catch (e) { toast(e.message, "err"); }
          ev.target.disabled = false;
        }
      }, "⬇️ Скачать PNG по прямой ссылке")
    );
  });
}

      entriesAll.forEach(j => {

      });

      const analysisBox = h("div", {});

        appendUi(analysisBox,
          h("div", { class:"info-box", style:{borderColor:"#84cc16"} },

              h("span", { class:"info-title", style:{marginBottom:0} }, "🧠 ИИ-разбор рефлексий за 7 дней"),

    const drawStudio = (curState) => {
      const plan = curState.plan || [];
      const doneDays = plan.filter(p => p.done).length;
      const pct = plan.length ? Math.round(100 * doneDays / plan.length) : 0;

      const fileInp = h("input", {
        type:"file", accept:".pdf,.docx,.txt,.md,image/*", class:"hidden",
        onchange: async (e) => {
          if (!e.target.files || !e.target.files.length) return;
          examFiles = await readFilesAsDataURL([e.target.files[0]]);
          fileLbl.textContent = "📎 Файл билетов: " + e.target.files[0].name;
          toast("Файл программы прикреплён ✅", "ok");

              ev.target.textContent = "⏳ ИИ анализирует билеты и строит план по дням…";

                await api("/api/g/plan", {
                  method:"POST",

                    subject: subjInp.value.trim(),

        const deepBox = h("div", {}, p.deep_notes ? renderMd(p.deep_notes) : null);

        return h("details", {
          class:"group-acc",

        },

            h("div", { class:"group-meta" },

              h("div", { class:"g-sub" },

              h("ul", { style:{margin:"4px 0", paddingLeft:"18px"} },

            deepBox,
            h("div", { class:"btn-row" },

                  hap("medium");

              h("button", {
                class:"btn ghost small",
                onclick: async (ev) => {
                  ev.target.disabled = true;
                  ev.target.textContent = "⏳ Пишу конспект дня…";
                  try {
                    const r = await api("/api/g/plan/expand", { method:"POST", body:{ d: p.d } });
                    p.deep_notes = r.deep_notes;
                    replaceUi(deepBox,
                      h("div", { class:"info-box", style:{borderColor:"#84cc16", marginTop:"6px"} },
                        h("div", { class:"info-title" }, "📖 Подробный конспект и разбор от ИИ"),

                  ev.target.textContent = "✨ Подробный разбор от ИИ";
                }
              }, "✨ Подробный разбор от ИИ")

          )
        );
      });

      replaceUi(wrap,
        plan.length ? h("div", { class:"card tight", style:{marginBottom:0} },
          h("div", { class:"row between" },
            h("div", {},
              h("div", { style:{fontWeight:900, fontSize:"1.08rem"} }, curState.plan_subject || "Экзамен"),
              h("div", { class:"sub" }, `Изучено дней: ${doneDays} из ${plan.length} (${pct}%)`)

        ) : null,
        builderForm,
        ...daysNodes
      );
    };

    drawStudio(st);
    return wrap;
  });

async function openDuelModal(duelId) {
  let d;
  try { d = await api("/api/g/duel/" + encodeURIComponent(duelId), { fresh: true }); }
  catch (e) { return toast(e.message, "err"); }

  sheet("⚔️ Дуэль: " + d.topic, (close) => {
    const box = h("div", {});
    const qs = d.qs || [];
    const answers = [];
    let idx = 0;

    const botLink = S.growthBot
      ? `https://t.me/${S.growthBot}?startapp=duel_${duelId}`
      : location.origin + `/app?duel=${duelId}`;

    const renderResults = (resList, myScore) => {
      replaceUi(box,
        h("div", { class:"card center" },
          h("div", { style:{fontSize:"42px"} }, "⚔️"),
          h("h2", { style:{margin:"6px 0"} }, myScore != null ? `Твой счёт: ${myScore} из ${qs.length}` : "Таблица дуэли"),
          h("div", { class:"sub" }, "Код дуэли: "),
          h("span", { class:"chip mono", style:{marginTop:"4px"} }, duelId)
        ),
        h("div", { class:"stack", style:{marginBottom:"14px"} },
          ...(resList || []).map((r, i) =>
            h("div", { class:"g-rank-row" },
              h("span", { class:"g-rank-pos" }, "#" + (i + 1)),
              h("span", { class:"grow", style:{fontWeight:700} }, r.name),
              h("span", { class:"chip green" }, r.score + " / " + (r.total || 5))
            )
          )
        ),
        h("div", { class:"btn-row" },
          h("button", {
            class:"btn",
            onclick: () => {
              const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(botLink)}&text=${encodeURIComponent("⚔️ Вызываю тебя на дуэль знаний по теме «" + d.topic + "»! Код: " + duelId)}`;
              if (tg && tg.openTelegramLink) tg.openTelegramLink(shareUrl);
              else window.open(shareUrl, "_blank");
            }
          }, "📨 Бросить вызов другу"),
          h("button", {
            class:"btn ghost",
            onclick: () => {
              navigator.clipboard.writeText(duelId);
              toast("Код " + duelId + " скопирован!", "ok");
            }
          }, "📋 Код: " + duelId)
        )
      );
    };

    if (d.played || !qs.length) {
      renderResults(d.res, null);
      return box;
    }

    const step = () => {
      if (idx >= qs.length) {
        replaceUi(box, h("div", { class:"center sub", style:{padding:"24px"} }, "⏳ Подсчёт очков…"));
        api("/api/g/duel/" + encodeURIComponent(duelId) + "/answer", {
          method:"POST", body:{ a: answers }
        }).then(r => {
          pick("success");
          renderResults(r.res, r.score);
          render();
        }).catch(err => toast(err.message, "err"));
        return;
      }
      const q = qs[idx];
      replaceUi(box,
        h("div", { class:"session-progress" },
          h("span", {}, `Вопрос ${idx + 1} / ${qs.length}`),
          h("div", { class:"bar" }, h("i", { style:{width: Math.round(100 * idx / qs.length) + "%"} }))
        ),
        h("div", { class:"card" },
          h("div", { style:{fontWeight:800, fontSize:"1.02rem", marginBottom:"12px"} }, q.q),
          h("div", { class:"stack" },
            ...(q.a || []).map((opt, oi) =>
              h("button", {
                class:"btn ghost",
                style:{justifyContent:"flex-start", textAlign:"left"},
                onclick: () => { hap(); answers.push(oi); idx++; step(); }
              }, opt)
            )
          )
        )
      );
    };
    step();
    return box;
  });
}

        buildCompanionSvg(comp.stage, st.risk, st.streak, () => openLevelModal(st))
      ),
      h("div", { class:"g-xp-strip", style:{cursor:"pointer"}, onclick: () => openLevelModal(st) },
        h("div", { class:"row between", style:{fontSize:"0.76rem", fontWeight:700} },
          h("span", {}, `Прогресс до уровня ${(st.level ?? 1) + 1} (нажми — история XP и деревья)`),
          h("span", { class:"mono" }, `${st.xp_in_level ?? 0} / 100 XP`)
        ),
        h("div", { class:"g-xp-bar" }, h("i", { style:{width: (st.xp_in_level ?? 0) + "%"} }))
      )
    )
  );

  appendUi(root, seg([
    ["hub", "🌱 Квест & Привычки"],
    ["ai", "🧠 ИИ-Прокачка"],
    ["social", "🏆 Лидерборд & Дуэли"]
  ], S.growthSub, (id) => { hap(); S.growthSub = id; render(); }));

  if (S.growthSub === "ai") {
    appendUi(root, renderGrowthAiPane(st));
  } else if (S.growthSub === "social") {
    appendUi(root, await renderGrowthSocialPane(st));
  } else {
    appendUi(root, renderGrowthHubPane(st));
  }

  return root;
}

function renderGrowthHubPane(st) {
  const box = h("div", { class:"g-shell" });
  const doneCount = (st.quest || []).filter(q => q.done).length;

  appendUi(box,
    h("div", { class:"g-sec-head" },
      h("h2", {}, "Ежедневный квест (обновление в 06:00)"),
      h("span", { class:"num" }, `${doneCount}/3 ВЫПОЛНЕНО · +35 XP`)

    h("div", { class:"g-quest-list" },
      ...(st.quest || []).map(q =>
        h("div", {
          class: "g-quest-item" + (q.done ? " done" : ""),
          onclick: async () => {
            hap();
            if (q.done) {
              await api("/api/g/quest/undo", { method:"POST", body:{ id: q.id } });
              toast("Шаг квеста отменён ↩️");
              render();
              return;
            }
            switchTab(q.tab);
          }
        },
          h("div", { class:"g-quest-check" }, q.done ? "✓" : ""),
          h("div", { class:"grow" },
            h("div", { style:{fontWeight:700, fontSize:"0.94rem"} }, q.title),

          ),
          h("span", { class:"chip " + (q.done ? "green" : "gray") }, q.done ? "↩️ Отменить" : `+${q.xp} XP`)
        )
      ),
      h("div", {
        class: "g-quest-item" + (st.lessons_checked ? " done" : ""),
        onclick: async () => {
          hap("medium");
          const res = await api("/api/g/checkin", { method:"POST" });
          if (res.undone) toast("Отметка посещения пар снята ↩️");
          else { pick("success"); toast("Посещение пар отмечено! +15 XP 🎓", "ok"); }
          render();
        }
      },
        h("div", { class:"g-quest-check" }, st.lessons_checked ? "✓" : "🎓"),
        h("div", { class:"grow" },
          h("div", { style:{fontWeight:700, fontSize:"0.94rem"} }, "Был(а) сегодня на парах / учёбе"),
          h("div", { class:"sub" }, st.lessons_checked ? "Чекин засчитан (нажми, чтобы отменить)" : "Отметь посещение в 1 тап")
        ),
        h("span", { class:"chip " + (st.lessons_checked ? "green" : "cyan") }, st.lessons_checked ? "↩️ Отменить" : "+15 XP")
      )
    )
  );

  // ЦЕЛИ И ПРИВЫЧКИ: РОВНО 7 ДНЕЙ ТЕКУЩЕЙ НЕДЕЛИ (ПН–ВС) + НАКОПИТЕЛЬНЫЙ ОГОНЁК 🔥
  const weekDays = (st.week_days && st.week_days.length === 7)
    ? st.week_days
    : Array.from({ length: 7 }, (_, i) => {
        const cur = parse(st.today);
        const monOffset = (cur.getDay() + 6) % 7;
        return addDays(st.today, i - monOffset);
      });

  const CAT_LABELS = {
    body: "💪 Спорт",
    mind: "🇬🇧 Языки & Учёба",
    work: "💻 Проекты",
    fin: "💎 Финансы"
  };

  appendUi(box,
    h("div", { class:"g-sec-head" },
      h("h2", {}, "Цели и привычки (Пн – Вс)"),
      h("button", {
        class:"chip",
        onclick: () => {
          sheet("➕ Новая привычка и дни недели", (close) => {
            const nameInp = h("input", { type:"text", placeholder:"Напр., Зал / Разминка, Английский, Код…" });
            const catSel = h("select", {}, Object.entries(CAT_LABELS).map(([k, v]) => h("option", { value: k }, v)));
            const pickedDays = new Set([1, 3, 5]); // По умолчанию Вт, Чт, Сб
            const daysPicker = h("div", { class:"g-week-grid" });

            const drawPicker = () => {
              replaceUi(daysPicker, ...DAYS.map((dName, idx) =>
                h("div", {
                  class: "g-day-cell" + (pickedDays.has(idx) ? " done" : ""),
                  onclick: () => {
                    hap();
                    if (pickedDays.has(idx) && pickedDays.size > 1) pickedDays.delete(idx);
                    else pickedDays.add(idx);
                    drawPicker();
                  }
                }, h("span", { class:"w-lbl" }, dName), h("span", { class:"w-num" }, pickedDays.has(idx) ? "🔥" : "—"))
              ));
            };
            drawPicker();

            return h("div", { class:"stack" },
              field("Название привычки", nameInp),
              field("Сфера", catSel),
              field("В какие дни недели цель заниматься?", daysPicker),
              h("button", {
                class:"btn block",
                onclick: async () => {
                  if (!nameInp.value.trim()) return toast("Введите название", "err");
                  await api("/api/g/goals", {
                    method:"POST",
                    body:{ name: nameInp.value.trim(), cat: catSel.value, target: Array.from(pickedDays) }
                  });
                  pick("success"); close(); render();
                }
              }, "Создать привычку")
            );
          });
        }
      }, "➕ Добавить")
    )
  );

  if (!(st.goals || []).length) {
    appendUi(box, empty("🎯", "Привычек пока нет", "Добавь спорт, английский или проект и выбери дни недели для цели."));
  } else {
    st.goals.forEach(g => {
      const allDays = g.days || [];
      const doneToday = allDays.includes(st.today);
      const fireCount = typeof g.fire === "number" ? g.fire : allDays.length;
      const targetWeekdays = Array.isArray(g.target) && g.target.length ? g.target : [0, 1, 2, 3, 4, 5, 6];
      const targetNames = targetWeekdays.map(i => DAYS[i]).join(", ");
      const thisWeekDoneDates = weekDays.filter(dStr => allDays.includes(dStr));

      appendUi(box,
        h("div", { class:"g-habit-card" },
          h("div", { class:"g-habit-top" },
            h("div", { class:"row wrap", style:{gap:"6px"} },
              h("span", { class:"chip gray" }, CAT_LABELS[g.cat] || "🎯 Цель"),
              h("span", { class:"chip warn", title:"Накопительный огонёк привычки (не сгорает при смене недели)" }, `🔥 ${fireCount}`)
            ),
            h("div", { class:"row", style:{gap:"6px"} },
              h("button", {
                class: "btn small " + (doneToday ? "subtle" : ""),
                onclick: async () => {
                  hap("medium");
                  const r = await api("/api/g/goals/" + g.id + "/check", { method:"POST", body:{ date: st.today } });
                  toast(r.checked ? `Отмечено! 🔥 ${r.fire} (+10 XP)` : "Отметка снята ↩️", r.checked ? "ok" : "");
                  render();
                }
              }, doneToday ? "✓ Сегодня" : "+1 🔥 Сегодня"),
              h("button", {
                class:"btn ghost small icon",
                title:"Удалить привычку",
                onclick: async () => {
                  if (!confirm(`Удалить привычку «${g.name}»?`)) return;
                  await api("/api/g/goals/" + g.id, { method:"DELETE" });
                  render();
                }
              }, "✕")
            )
          ),

          h("div", {},
            h("div", { class:"g-habit-title" }, g.name),
            h("div", { class:"sub", style:{marginTop:"2px"} },
              `План: ${targetNames} · На этой неделе: ${thisWeekDoneDates.length} из ${targetWeekdays.length}`)
          ),

          // Шкала ровно на 7 дней текущей недели (Пн, Вт, Ср, Чт, Пт, Сб, Вс)
          h("div", { class:"g-week-grid" },
            ...weekDays.map((dStr, idx) => {
              const isDone = allDays.includes(dStr);
              const isTarget = targetWeekdays.includes(idx);
              const isToday = dStr === st.today;
              return h("div", {
                class: "g-day-cell" + (isDone ? " done" : (isTarget ? " target" : "")) + (isToday ? " today" : ""),
                title: `${DAYS[idx]} (${dStr}) — нажми, чтобы отметить/снять`,
                onclick: async () => {
                  hap("light");
                  await api("/api/g/goals/" + g.id + "/check", { method:"POST", body:{ date: dStr } });
                  render();
                }
              },
                h("span", { class:"w-lbl" }, DAYS[idx]),
                h("span", { class:"w-num" }, isDone ? "🔥" : parse(dStr).getDate())
              );
            })
          ),

          // Открывающееся меню истории и настройки дней недели
          h("details", { class:"topic-acc", style:{marginTop:"4px"} },
            h("summary", { style:{padding:"8px 10px", fontSize:"0.82rem"} },
              h("span", { class:"grow" },
                thisWeekDoneDates.length
                  ? "📅 На этой неделе: " + thisWeekDoneDates.map(d => `${DAYS[(parse(d).getDay()+6)%7]} (${fmtShort(d)})`).join(", ")
                  : "📅 История на этой неделе и настройка целевых дней"),
              h("span", { class:"chev" })
            ),
            h("div", { class:"topic-body stack", style:{gap:"8px"} },
              h("div", { class:"sub" },
                `Всего накоплено огоньков за всё время: 🔥 ${fireCount}. При переходе на новую неделю полоска Пн–Вс очищается, а твои огоньки 🔥 сохраняются!`),
              h("div", { class:"sub", style:{fontWeight:700} }, "Выбери целевые дни недели для этой привычки:"),
              h("div", { class:"chips", style:{marginTop:0} },
                ...DAYS.map((dName, idx) => {
                  const active = targetWeekdays.includes(idx);
                  return h("button", {
                    class: "chip " + (active ? "green" : "gray"),
                    onclick: async () => {
                      const nextSet = new Set(targetWeekdays);
                      if (nextSet.has(idx) && nextSet.size > 1) nextSet.delete(idx);
                      else nextSet.add(idx);
                      await api("/api/g/goals/" + g.id + "/check", {
                        method:"POST",
                        body:{ target: Array.from(nextSet) }
                      });
                      render();
                    }
                  }, dName);
                })
              ),
              allDays.length ? h("div", { class:"sub" },
                "Последние выполненные даты: " + allDays.slice(-10).reverse().map(d => `${DAYS[(parse(d).getDay()+6)%7]} ${fmtShort(d)}`).join(" · ")
              ) : null
            )
          )
        )
      );
    });
  }

  // ВЕЧЕРНИЙ ДНЕВНИК И КНОПКА ХАБА «РАЗГОВОРЫ РЕФЛЕКСИИ»
  const jInp = h("textarea", { placeholder:"Как реально прошёл день? Что получилось, а что устал делать?…" });
  const totalReflections = (st.journal || []).length;
  const lastEntry = totalReflections ? st.journal[totalReflections - 1] : null;

  appendUi(box,
    h("div", { class:"g-sec-head" },
      h("h2", {}, "Вечерний дневник & ИИ-рефлексия"),
      h("span", { class:"num" }, "+12 XP")
    ),
    h("div", { class:"card stack" },
      jInp,
      h("button", {
        class:"btn block",
        onclick: async (ev) => {
          const txt = jInp.value.trim();
          if (!txt) return toast("Напиши хотя бы пару слов", "err");
          ev.target.disabled = true;
          ev.target.textContent = "⏳ ИИ отвечает…";
          try {
            await api("/api/g/journal", { method:"POST", body:{ text: txt } });
            pick("success");
            jInp.value = "";
            const fresh = await api("/api/g/state", { fresh: true });
            render();
            openReflectionHubModal(fresh);
          } catch (e) {
            toast(e.message, "err");
            ev.target.disabled = false;
            ev.target.textContent = "✨ Сохранить и начать диалог рефлексии";
          }
        }
      }, "✨ Сохранить и начать диалог рефлексии"),

      h("div", {
        class:"info-box tappable",
        style:{marginBottom:0, cursor:"pointer", borderColor:"var(--line-2)"},
        onclick: () => openReflectionHubModal(st)
      },
        h("div", { class:"row between" },
          h("div", { class:"row", style:{gap:"10px", flex:1, minWidth:0} },
            h("div", { class:"group-icon" }, "💬"),
            h("div", { class:"grow" },
              h("div", { style:{fontWeight:800, fontSize:"0.95rem"} }, `Разговоры рефлексии (${totalReflections})`),
              h("div", { class:"sub" },
                lastEntry
                  ? `Последний: ${fmtShort(lastEntry.d)} — продолжить диалог, PDF или ИИ-анализ за 7 дней`
                  : "Открыть архив по датам и ИИ-аналитику недели")
            )
          ),
          h("span", { class:"chip", style:{flexShrink:0} }, "Открыть →")
        )
      )
    )
  );

  appendUi(box,
    h("div", { class:"card row between wrap" },
      h("div", { class:"grow" },
        h("div", { style:{fontWeight:800} }, "🔔 Пуши и утренний брифинг в боте"),
        h("div", { class:"sub" }, "08:00 — сводка пар и задач · 22:00 — защита серии от сгорания")
      ),
      h("div", { class:"row", style:{gap:"8px"} },
        h("button", {
          class:"btn ghost small",
          onclick: async (ev) => {
            ev.target.disabled = true;
            try {
              await api("/api/g/briefing", { method:"POST" });
              pick("success"); toast("Брифинг отправлен в Telegram! 📬", "ok");
            } catch (e) { toast(e.message, "err"); }
            ev.target.disabled = false;
          }
        }, "📬 Тест в ТГ"),
        h("button", {
          class: "sw" + (st.notify ? " on" : ""),
          onclick: async (ev) => {
            ev.target.classList.toggle("on");
            await api("/api/g/notify", { method:"POST" });
          }
        })
      )
    )
  );

  return box;
}

function renderGrowthAiPane(st) {
  const box = h("div", { class:"g-shell" });
  let snapFiles = [];
  let snapKind = "photo";
  const fileLabel = h("span", {}, "📷 Выбрать фото задачи/конспекта или 🎤 аудио лекции");
  const snapText = h("input", { type:"text", placeholder:"Укажи предмет (напр., Геометрия) или вопрос…" });
  const snapResult = h("div", {});

  const snapInput = h("input", {
    type:"file", accept:"image/*,audio/*,.ogg,.mp3,.m4a,.wav,.pdf", class:"hidden",
    onchange: async (e) => {
      if (!e.target.files || !e.target.files.length) return;
      const f = e.target.files[0];
      snapKind = (f.type || "").startsWith("audio/") || /\.(ogg|mp3|m4a|wav)$/i.test(f.name) ? "voice" : "photo";
      snapFiles = await readFilesAsDataURL([f]);
      fileLabel.textContent = (snapKind === "voice" ? "🎤 Аудио: " : "📷 Файл: ") + f.name;
      toast("Файл готов к разбору", "ok");
    }
  });

  appendUi(box,
    h("div", { class:"g-sec-head" },
      h("h2", {}, "Сфоткал конспект / Голосовое с лекции"),
      h("span", { class:"num" }, "РАЗБОР + КАРТОЧКИ ПО ТЕМЕ + ТЕСТ + PDF")
    ),
    h("div", { class:"card stack" },
      h("div", { class:"sub" },

          ev.target.textContent = "⏳ ИИ разбирает материал и создаёт карточки…";
          try {
            const r = await api("/api/g/snap", {
              method:"POST",
              body:{ kind: snapKind, text: snapText.value.trim(), files: snapFiles, save_cards: true }
            });
            pick("success");
            replaceUi(snapResult,
              h("div", { class:"info-box", style:{marginTop:"10px"} },
                h("div", { class:"row between wrap", style:{marginBottom:"10px", gap:"6px"} },
                  h("span", { class:"chip green" }, `📚 Колода «${r.title}»: +${r.saved_cards || (r.cards || []).length} карт.`),
                  h("div", { class:"row wrap", style:{gap:"6px"} },
                    (r.quiz && r.quiz.length) ? h("button", {
                      class:"btn small",
                      onclick: () => runQuizModal({ title: r.title, questions: r.quiz })
                    }, "🎯 Пройти тест") : null,
                    h("button", {
                      class:"btn ghost small",
                      onclick: async (btnEv) => {
                        btnEv.target.disabled = true;
                        try {
                          const pdfFile = await api("/api/g/pdf", {
                            method:"POST",
                            body:{ kind:"snap", title: r.title || "Конспект", content: r.answer || "" }
                          });
                          previewFileModal(pdfFile);
                        } catch (err) { toast(err.message, "err"); }
                        btnEv.target.disabled = false;
                      }
                    }, "📄 Скачать в PDF")
                  )
                ),
                renderMd(r.answer || "")
              )
            );
            toast(`Карточки сохранены в тему «${r.title}» 🎉`, "ok");
          } catch (e) { toast(e.message, "err"); }
          ev.target.disabled = false;
          ev.target.textContent = "🚀 Разобрать + создать карточки и тест";
        }
      }, "🚀 Разобрать + создать карточки и тест"),
      snapResult
    )
  );

  // КОМПАКТНАЯ КАРТОЧКА ВХОДА В ШТАБ ПОДГОТОВКИ К ЭКЗАМЕНУ (БЕЗ ЗАСОРЕНИЯ СТРАНИЦЫ)
  const plan = st.plan || [];
  const doneDays = plan.filter(p => p.done).length;
  const todayPlan = plan.find(p => p.d === st.today) || plan[0];

  appendUi(box,
    h("div", { class:"g-sec-head" },
      h("h2", {}, "Режим «Сдать экзамен за N дней»"),
      h("span", { class:"num" }, "ПО БИЛЕТАМ И ФАЙЛАМ")
    ),
    h("div", { class:"card stack" },
      plan.length ? h("div", {},
        h("div", { class:"row between" },
          h("div", { style:{fontWeight:800, fontSize:"1.02rem"} }, `🎓 ${st.plan_subject || "Экзамен"}`),
          h("span", { class:"chip green" }, `Изучено: ${doneDays}/${plan.length} дн.`)
        ),
        todayPlan ? h("div", { class:"info-box", style:{marginTop:"8px", marginBottom:0} },
          h("div", { class:"info-title" }, `📌 План на ${fmtShort(todayPlan.d)}`),
          h("div", { style:{fontWeight:700, fontSize:"0.92rem"} }, todayPlan.t),
          todayPlan.details ? h("div", { class:"sub", style:{marginTop:"4px"} }, todayPlan.details) : null
        ) : null
      ) : h("div", { class:"sub" },
        "Загрузи файл с билетами/программой экзамена или вставь список тем — ИИ составит пошаговый план на каждый день с разбором подтем и добавит слоты в расписание."),
      h("button", {
        class:"btn block",
        onclick: () => openExamStudioModal(st)
      }, plan.length ? "🎓 Открыть штаб подготовки (все дни и темы) →" : "➕ Загрузить темы и создать план подготовки")
    )
  );

  return box;
}

  // 2. КОМНАТА ГРУППЫ / ПОТОКА + ОБЩИЕ ДЕДЛАЙНЫ
  appendUi(box,
    h("div", { class:"g-sec-head" },
      h("h2", {}, b.title || "Лидерборд группы"),
      h("button", {
        class:"chip",
        onclick: () => {
          sheet("👥 Комната учебной группы", (close) => {
            const codeInp = h("input", { type:"text", value: b.code || "", placeholder:"Код комнаты (напр., FPM-101)" });
            const titleInp = h("input", { type:"text", placeholder:"Название группы (если создаёте новую)" });
            return h("div", { class:"stack" },
              h("div", { class:"sub" }, "Один человек создаёт код комнаты и ведёт общие дедлайны — одногруппники вводят этот же код и видят общий лидерборд и дедлайны."),
              field("Инвайт-код группы", codeInp),
              field("Название потока / группы", titleInp),
              h("button", {
                class:"btn block",
                onclick: async () => {
                  await api("/api/g/group/join", { method:"POST", body:{ code: codeInp.value.trim(), title: titleInp.value.trim() } });
                  pick("success"); close(); render();
                }
              }, "Подключиться к группе")
            );
          });
        }
      }, b.code ? `🔑 Код: ${b.code}` : "➕ Войти в группу")
    )
  );

  // Общие дедлайны группы
  if (b.has) {
    appendUi(box,
      h("div", { class:"card stack" },
        h("div", { class:"row between" },
          h("div", { style:{fontWeight:800} }, "📌 Общие дедлайны потока"),
          b.owner ? h("span", { class:"chip green" }, "Вы староста/ведущий") : h("span", { class:"chip gray" }, "Подписка")
        ),
        (b.dl && b.dl.length)
          ? h("div", { class:"stack" }, ...b.dl.map(x =>
              h("div", { class:"row between", style:{padding:"7px 10px", background:"var(--surface-2)", borderRadius:"8px"} },
                h("span", { style:{fontWeight:600, fontSize:"0.9rem"} }, x.t),
                h("span", { class:"chip warn" }, fmtShort(x.d))
              )
            ))
          : h("div", { class:"sub" }, "Общих дедлайнов пока нет."),
        b.owner ? h("button", {
          class:"btn ghost small block",
          onclick: () => {
            sheet("📢 Добавить дедлайн для всей группы", (close) => {
              const tInp = h("input", { type:"text", placeholder:"Что сдаём (напр., Коллоквиум по матану)" });
              const dInp = h("input", { type:"date", value: addDays(st.today, 7) });
              return h("div", { class:"stack" },
                field("Событие или дедлайн", tInp),
                field("Дата", dInp),
                h("button", {
                  class:"btn block",
                  onclick: async () => {
                    await api("/api/g/group/dl", { method:"POST", body:{ t: tInp.value.trim(), d: dInp.value } });
                    pick("success"); close(); render();
                  }
                }, "Опубликовать для группы")
              );
            });
          }
        }, "➕ Добавить общий дедлайн") : null
      )
    );
  }

  // Лидерборд участников
  appendUi(box,
    h("div", { class:"stack" },
      ...(b.rows || []).map((r, i) =>
        h("div", { class: "g-rank-row" + (r.me ? " me" : "") },
          h("span", { class:"g-rank-pos" }, i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `#${i + 1}`),
          renderAvatar(r.avatar || "🧑‍💻", "sm"),
          h("div", { class:"grow" },
            h("div", { style:{fontWeight:800, fontSize:"0.92rem"} }, r.name),
            h("div", { class:"sub" }, `Уровень ${r.level || 1} · 🔥 ${r.streak ?? 0} дн.`)
          ),
          h("span", { class:"chip green mono" }, `${r.xp ?? 0} XP`)
        )
      )
    )
  );

  return box;
}

const VIEWS = {
  home: viewHome,
  tt: viewTT,
  tasks: viewTasks,
  study: viewStudy,
  growth: viewGrowth,
  chat: viewChat
};

async function boot() {
  drawNav();
  try {
    S.me = await api("/api/me");
    if (S.me && S.me.account && S.me.account.id) {
      setActiveAccountId(S.me.account.id);
    }
    const requestedTab = new URLSearchParams(location.search).get("tab");
    if (["tasks","study","tt"].includes(requestedTab)) { S.tab=requestedTab; drawNav(); }
    S.today = (S.me && S.me.now ? S.me.now.slice(0, 10) : "") || iso(new Date());
    if (!S.ttDate) S.ttDate = S.today;

    // Авто-запуск дуэли по ссылке ?startapp=duel_XXXX или ?duel=XXXX
    const startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param)
      || new URLSearchParams(location.search).get("duel") || "";
    if (startParam.startsWith("duel_")) {
      S.tab = "growth";
      S.growthSub = "social";
      drawNav();
      setTimeout(() => openDuelModal(startParam.slice(5)), 350);
    } else if (startParam && !startParam.startsWith("tt_")) {
      setTimeout(() => openDuelModal(startParam), 350);
    }

    await render();
    const invite = new URLSearchParams(location.search).get("invite") ||
      (startParam.startsWith("tt_") ? startParam.slice(3) : "");
    if (invite && !S.inviteShown) {
      S.inviteShown=true;
      await showInvite(invite);
    } else if (!startParam && !requestedTab && !guideSeen()) {
      openGuide();
    }
  } catch (e) {
    document.getElementById("view").replaceChildren(
      h("div", { class:"card" },
        h("h3", {}, "Ошибка подключения"),
        h("p", { class:"sub", style:{marginTop:"6px"} }, e.message),
        h("button", { class:"btn block", style:{marginTop:"12px"}, onclick: boot }, "🔄 Повторить")
      )
    );
  }
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.me && ["home","tt"].includes(S.tab) && !document.querySelector(".overlay, .tour-layer")) {
    API_CACHE.clear(); render();
  }
});
boot();
</script>
</body>
</html>
