services:
  - type: web
    name: academic-gemini-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_KEYS
        sync: false
      - key: TARGET_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: GIST_ID
        sync: false
      - key: GIST_TOKEN
        sync: false
